<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen roadmap</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F1;--surface:#FFFFFF;--surface-2:#E7EBEA;--ink:#1D2528;--ink-2:#55616A;--ink-3:#77838A;
  --line:#D6DDDC;--steel:#C2CACC;--steel-2:#A1ABAF;--steel-hi:#EDF0F0;
  --ni:#C98A06;--si:#2F7A3D;--ko:#C2362B;--it:#2456A6;--de:#8A4E24;--es:#3E7480;--ta:#6B4AA0;
  --btn:#1D2528;--btn-ink:#FFFFFF;--focus:#2456A6;--good:#2F7A3D;--warn:#9A5B00;
  --display:"Caprasimo","Cooper Black","Georgia",serif;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121719;--surface:#1B2225;--surface-2:#242D31;--ink:#E6ECEC;--ink-2:#A6B2B6;--ink-3:#849196;
    --line:#2F393D;--steel:#3E4A4F;--steel-2:#5A676D;--steel-hi:#283135;
    --ni:#F0B429;--si:#5DBA6C;--ko:#F0645A;--it:#7AA3EE;--de:#D49866;--es:#6FB0BB;--ta:#B39AEA;
    --btn:#E6ECEC;--btn-ink:#121719;--focus:#7AA3EE;--good:#5DBA6C;--warn:#E3A33B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121719;--surface:#1B2225;--surface-2:#242D31;--ink:#E6ECEC;--ink-2:#A6B2B6;--ink-3:#849196;
  --line:#2F393D;--steel:#3E4A4F;--steel-2:#5A676D;--steel-hi:#283135;
  --ni:#F0B429;--si:#5DBA6C;--ko:#F0645A;--it:#7AA3EE;--de:#D49866;--es:#6FB0BB;--ta:#B39AEA;
  --btn:#E6ECEC;--btn-ink:#121719;--focus:#7AA3EE;--good:#5DBA6C;--warn:#E3A33B;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);align-items:start;min-height:100%}
.topbar{display:none}
.rail{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;min-height:100vh;overflow-y:auto;padding:26px 16px 24px 20px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin:0 6px 22px}
.brand b{font:400 22px/1.1 var(--display)}
.brand svg{width:34px;height:34px;flex:none}
.nav-group{margin:0 0 18px}
.nav-group > span{display:block;font-size:13px;color:var(--ink-3);margin:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:15px;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.nav a .pct{margin-left:auto;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tdot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.save{font-size:13px;color:var(--ink-3);margin:18px 10px 0;display:flex;gap:8px;align-items:center}
.save i{width:8px;height:8px;border-radius:50%;background:var(--steel-2);flex:none}
.save[data-s="cloud"] i{background:var(--good)}
.save[data-s="saving"] i,.save[data-s="offline"] i{background:var(--warn)}
.acct{margin:10px 0 0}
.acct-row{display:flex;gap:10px;align-items:center;text-decoration:none;padding:8px 10px;border-radius:10px;font-size:14.5px;line-height:1.3}
a.acct-row:hover{background:var(--surface-2)}
.acct-cta{display:inline-block;margin:0 10px;font-size:14px;font-weight:600}
.acct-btn{margin:0 10px}
.acct-top{display:block;text-decoration:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;letter-spacing:.02em}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0 0 10px;color:var(--ink)}
code{font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.steps li > span{min-width:0}
#cfgBox{font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:120px}

.main{padding:34px clamp(16px,4vw,56px) 96px;min-width:0}
.wrap{max-width:1060px}
h1.title{font:400 clamp(30px,4.2vw,46px)/1.06 var(--display);margin:0 0 12px;letter-spacing:-.005em;max-width:22ch}
h2.sec{font:400 27px/1.15 var(--display);margin:46px 0 8px}
h3{font-size:18px;line-height:1.3;font-weight:600;margin:0 0 6px}
p{margin:0 0 12px;max-width:70ch}
.lead{font-size:18px;line-height:1.5;color:var(--ink-2);max-width:60ch}
.muted{color:var(--ink-2)}.small{font-size:14px}.tiny{font-size:13px;color:var(--ink-3)}
.sec-lead{color:var(--ink-2);margin-bottom:18px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;line-height:1.3;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.tone{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.btn{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;padding:9px 16px;background:var(--btn);color:var(--btn-ink);cursor:pointer;line-height:1.2}
.btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--steel-2)}
.btn.quiet:hover{background:var(--surface-2)}
.btn.sm{font-size:14px;padding:7px 12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--c,var(--ink));border-radius:inherit;transition:width .4s ease}
label.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.45}
input[type="checkbox"]{width:19px;height:19px;accent-color:var(--c,var(--ink));margin:1px 0 0;flex:none;cursor:pointer}
label.check.done span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--steel-2)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.field input,.field select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--steel-2);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.45}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:14px;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:color-mix(in srgb,var(--ink) 5%,transparent)}
tfoot td{font-weight:700}
.ic{display:inline-block;vertical-align:middle;width:34px;height:34px;flex:none}

/* Today */
.hero{display:grid;grid-template-columns:minmax(230px,330px) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;margin:4px 0 10px}
.dabba{width:100%;height:auto;display:block}
.dabba a{cursor:pointer}
.dabba a:focus-visible circle.k{stroke:var(--focus);stroke-width:4}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;margin-top:18px}
.legend a{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;text-decoration:none;font-size:14.5px;font-weight:600}
.legend .bar{grid-column:2 / 4;height:6px}
.legend .pct{font-size:13px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:18px 0 0}
.stat b{display:block;font:400 30px/1 var(--display)}
.stat span{font-size:13.5px;color:var(--ink-2)}
.slots{list-style:none;padding:0;margin:0 0 0 7px;border-left:2px solid var(--line)}
.slot{position:relative;padding:2px 0 16px 22px}
.slot::before{content:"";position:absolute;left:-8px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--steel-2)}
.slot.now::before{background:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 15%,transparent)}
.slot.past{opacity:.6}
.slot time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink-2);margin-right:8px}
.slot .what{font-weight:600}
.slot p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.dish{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish svg{width:64px;height:64px}
.dish h3{margin:0 0 2px;font-size:16.5px}
.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--steel-2);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--ink)}
.upnext{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}

/* Roadmap */
details.phase{border:1px solid var(--line);border-radius:18px;background:var(--surface);margin:0 0 12px}
details.phase.current{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
details.phase > summary{list-style:none;cursor:pointer;padding:16px 20px;display:grid;grid-template-columns:44px minmax(0,1fr) 140px;gap:16px;align-items:center}
details.phase > summary::-webkit-details-marker{display:none}
.pnum{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 20px/1 var(--display);background:var(--surface-2)}
details.phase.done .pnum{background:var(--ink);color:var(--paper)}
.phase-body{padding:0 20px 20px 80px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;font:inherit;font-size:13.5px;font-weight:600;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface-2);color:var(--ink);cursor:pointer}
.chip svg{width:24px;height:24px;border-radius:50%;background:var(--surface)}
.chip[data-s="1"]{box-shadow:inset 0 0 0 2px var(--c)}
.chip[data-s="2"]{background:color-mix(in srgb,var(--c) 22%,var(--surface))}

/* Tree */
.track-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,380px);gap:28px;align-items:center}
.track-head svg.scene{width:100%;height:auto;display:block}
.tree-wrap{container-type:inline-size;margin-top:22px}
.tree{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.edges{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.edges path{opacity:.42;transition:opacity .15s ease,stroke-width .15s ease}.edges path.lit{opacity:.85}
.edges.focus path{opacity:.1}.edges.focus path.on{opacity:1;stroke-width:3}
.tier{position:relative;z-index:1;min-width:0}
.tier-head{padding:0 8px 10px;margin-bottom:6px;border-bottom:2px dotted var(--line)}
.tier-head b{display:block;font-weight:700;font-size:15px}
.tier-head span{font-size:13px;color:var(--ink-3)}
.tier-nodes{display:flex;flex-direction:column;gap:2px}
.node{appearance:none;background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 12px;border-radius:16px;text-align:center;width:100%}
.node:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.katori{width:86px;height:86px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--steel);display:grid;place-items:center;position:relative;transition:box-shadow .25s ease}
.katori svg{width:64px;height:64px}
.node[data-s="1"] .katori{box-shadow:inset 0 0 0 4px var(--c)}
.node[data-s="2"] .katori{background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 0 0 0 4px var(--c),0 0 0 4px var(--paper),0 0 0 7px var(--c)}
.node[data-lock="1"] .katori svg{opacity:.42;filter:grayscale(.7)}
.node .mark{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:0 0 0 3px var(--paper)}
.node .mark svg{width:16px;height:16px}
.node-name{font-size:14.5px;font-weight:600;line-height:1.25;max-width:160px}
.node-sub{font-size:12.5px;color:var(--ink-3);line-height:1.3}
@container (max-width:680px){
  .tree{grid-template-columns:1fr;gap:20px}
  .tier-nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:2px}
  .edges{display:none}
  .katori{width:76px;height:76px}.katori svg{width:56px;height:56px}
}

/* Dialog */
dialog.dlg{border:0;padding:0;border-radius:22px;width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog.dlg::backdrop{background:rgba(16,21,23,.52)}
.dlg-head{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:16px;padding:22px 22px 6px;align-items:center}
.dlg-head .katori{width:104px;height:104px}.dlg-head .katori svg{width:80px;height:80px}
.dlg-head h2{font:400 26px/1.1 var(--display);margin:0 0 6px}
.dlg-body{padding:10px 22px 22px}
.dlg-body h3{font-size:15px;margin:18px 0 4px;color:var(--ink-2)}
.x{border:0;background:var(--surface-2);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;align-self:start}
.counter{display:inline-flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.counter b{min-width:2ch;text-align:center;font-size:18px}

/* Menu, weekends, kitchen, progress */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.day{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.day .day-art{position:absolute;right:10px;top:8px;width:52px;height:52px}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day h3{display:flex;gap:8px;align-items:center;min-height:40px;margin-right:52px}
.day dl{margin:0;font-size:14.5px}
.day dt{color:var(--ink-3);font-size:13px;margin-top:8px}
.day dd{margin:0;font-weight:500}
.formulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.formula{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.formula svg{width:56px;height:56px}
.formula h3{font-size:16px;margin:0 0 2px}
button.formula{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.formula:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.wk-row td{vertical-align:middle}
.wk-dish{display:flex;gap:12px;align-items:center;min-width:240px}
.wk-dish svg{width:44px;height:44px;flex:none}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps.checkable li::before{display:none}
.steps.checkable li{grid-template-columns:1fr}
.timeline{display:grid;grid-template-columns:1fr;margin:8px 0 0}
.timeline div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:9px 12px;border-left:4px solid var(--steel);font-size:15px}
.timeline div:last-child{border-left-color:var(--ink)}
.timeline time{font-weight:700;font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.range{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;margin:0 0 10px;font-size:14.5px;color:var(--ink-2)}
.range output{font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--ink)}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big div{background:var(--surface-2);border-radius:14px;padding:14px}
.big b{display:block;font:400 28px/1.05 var(--display);margin-top:2px}
.big span{font-size:13.5px;color:var(--ink-2)}
.macro{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0 8px;background:var(--surface-2)}
.macro i{display:block;height:100%}
.chart svg{width:100%;height:auto;display:block}
.log-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.log-form .field{width:150px}
.note{border-left:4px solid var(--c,var(--ink));padding:10px 14px;background:var(--surface);border-radius:0 12px 12px 0;margin:12px 0}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--steel-2);border-radius:14px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);padding:10px 16px;border-bottom:1px solid var(--line)}
  .topbar .brand{margin:0;flex:1}
  .rail{display:none;position:static;min-height:0;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}
  .rail.open{display:block}
  .rail .brand{display:none}
  .nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 16px}
  .main{padding-top:22px}
}
@media (max-width:720px){
  .hero,.two,.calc,.track-head{grid-template-columns:1fr}
  .hero{gap:8px}
  .dabba{max-width:300px;margin:0 auto}
  details.phase > summary{grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 16px}
  details.phase > summary .bar-wrap{grid-column:2}
  .phase-body{padding:0 16px 18px;grid-template-columns:1fr}
  .range{grid-template-columns:110px minmax(0,1fr) 56px}
  .dlg-head{grid-template-columns:80px minmax(0,1fr) auto}
  .dlg-head .katori{width:80px;height:80px}.dlg-head .katori svg{width:60px;height:60px}
}
</style>
</head>

 {id:"ni", hash:"north-indian", name:"North Indian", short:"North Indian", scene:"thali",

  ["pidi-kozhukattai","Pidi kozhukattai",4,"kozhukattai",["sakkarai-pongal"],"Phase 5","Cook rice flour into a dough, press it in your fist and steam the dumplings, sweet or savoury.","Shape the dough while it’s still warm, with lightly oiled hands; the finger marks are the point."],
  ["virundhu","A banana-leaf virundhu",4,"virundhu",["kootu","sakkarai-pongal"],"Week 26 option","Serve a full Tamil meal on a banana leaf: rice, kuzhambu, rasam, kootu, poriyal, a sweet and buttermilk.","Make the kuzhambu and the sweet the day before and cook the rest that morning."]

 {id:"de", hash:"desserts", name:"Desserts", short:"Desserts", scene:"mithai",

const ST="var(--steel)",SH="var(--steel-hi)",S2="var(--steel-2)";
const c=(x,y,r,f,a="")=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${a}/>`;
const el=(x,y,rx,ry,f,a="")=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${a}/>`;
const pa=(d,f,a="")=>`<path d="${d}" fill="${f}" ${a}/>`;
const re=(x,y,w,h,f,rx=2,a="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${a}/>`;
const st=(d,s,w=1.6)=>`<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const lf=(x,y,rot=0,f="#3E8E41")=>`<ellipse cx="${x}" cy="${y}" rx="2.8" ry="1.4" fill="${f}" transform="rotate(${rot} ${x} ${y})"/>`;
const herbs=pts=>pts.map(q=>lf(q[0],q[1],q[2]||0,q[3])).join("");
const dots=(pts,r,f)=>pts.map(q=>c(q[0],q[1],r,f)).join("");

const PLATE=(g="")=>el(32,38,29,18,S2)+el(32,37,29,17.5,SH)+el(32,37,20,11.5,"none",`stroke="${ST}" stroke-width="1.2"`)+g;

const GLASS=(layers,top="")=>{
  const xl=y=>18+(y-12)*0.1,xr=y=>46-(y-12)*0.1;
  let s=pa("M17 12 L47 12 L43 54 Q32 57 21 54 Z",SH,`stroke="${S2}" stroke-width="1.4"`);
  layers.forEach(([a,b,f])=>{s+=pa(`M${xl(a)} ${a} L${xr(a)} ${a} L${xr(b)} ${b} L${xl(b)} ${b} Z`,f);});
  return s+top;
};
const EGG=(x,y,s=1)=>el(x,y,9*s,7*s,"#FFFFFF",`stroke="#E7E2D6" stroke-width="0.8"`)+c(x+1*s,y-0.5*s,3.4*s,"#F2A814");

const DRUM=(x,y,rot=0,f="#C9803E")=>`<g transform="rotate(${rot} ${x} ${y})">${el(x,y,9,6.5,f)}${re(x+7,y-1.6,9,3.2,"#F3E9D6",1.6)}${c(x+16.5,y-1.8,2.2,"#F3E9D6")}${c(x+16.5,y+1.6,2.2,"#F3E9D6")}</g>`;
const RICE=(x,y,w,h,f="#F7F2E4")=>pa(`M${x-w} ${y} Q${x-w*0.8} ${y-h} ${x} ${y-h} Q${x+w*0.8} ${y-h} ${x+w} ${y} Z`,f);

function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function parseIso(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function planStart(){const s=state&&state.start;return s&&/^\d{4}-\d{2}-\d{2}$/.test(s)?parseIso(s):mondayOf(today0());}
function planWeek(d=today0()){return Math.floor(Math.round((d-planStart())/DAY)/7);}
function monthOf(w){return w<1?0:Math.min(6,Math.ceil(w/4.34));}
function weekLabel(w){return w<1?"Week 0":`Week ${w}, Month ${monthOf(w)}`;}
function phaseOf(w){if(w<0)return PHASES[0];for(const p of PHASES){if(w>=p.from&&w<=p.to)return p;}return PHASES[5];}
function fmtDay(d,o={weekday:"short",day:"numeric",month:"short"}){return d.toLocaleDateString("en-GB",o);}
function weekLetter(w){return (w<=0||w%2===1)?"A":"B";}

const FB_VER="12.2.1";
const FB_CFG_KEY="kitchen-roadmap-fbconfig";
const FILE_CFG=!!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId);
const RULES_TXT=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

const fb={cfg:null,auth:null,db:null,mod:null,user:null,unsub:null,err:""};
fb.cfg=getConfig();
function getConfig(){
  if(FILE_CFG)return FIREBASE_CONFIG;
  try{const c=JSON.parse(localStorage.getItem(FB_CFG_KEY)||"null");if(c&&c.apiKey&&c.projectId&&c.appId)return c;}catch(e){}
  return null;
}
function parseConfig(txt){
  const out={},re=/(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g;let m;
  while((m=re.exec(String(txt))))out[m[1]]=m[2];
  if(out.projectId&&!out.authDomain)out.authDomain=out.projectId+".firebaseapp.com";
  return out.apiKey&&out.projectId&&out.appId?out:null;
}
function errText(code){
  const c=String(code||"");
  if(c==="file")return "Google sign-in only works when this page is opened from a web address, not from a file on your computer. See step 5 below.";
  if(c==="load")return "Couldn’t load Firebase. Check your connection and reload the page.";
  if(c==="config")return "That doesn’t look like a complete Firebase config. It needs at least apiKey, projectId and appId.";
  if(c==="rules"||c==="permission-denied")return "Firestore refused to save. Paste the security rules below into Firestore Database, Rules, and publish them.";
  if(c.includes("unauthorized-domain"))return `This address (${location.host||"this page"}) isn’t on your authorized domains. Add it in Firebase under Authentication, Settings, Authorized domains.`;
  if(c.includes("operation-not-allowed"))return "Google sign-in isn’t switched on. Enable it in Firebase under Authentication, Sign-in method.";
  if(c.includes("network-request-failed"))return "Couldn’t reach Google. Check your connection and try again.";
  if(c.includes("api-key"))return "Firebase didn’t accept the API key. Paste your config again below.";
  if(c.includes("failed-precondition")||c.includes("not-found"))return "Firestore isn’t ready. Create a Firestore database in your Firebase project (step 4).";
  return `Something went wrong (${c}). Try again in a moment.`;
}
function initials(){const n=(fb.user&&(fb.user.name||fb.user.email))||"?";return esc(n.split(/[\s@.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(""));}

async function initFirebase(){
  fb.cfg=getConfig();
  if(!fb.cfg){setStatus("setup");render();return;}
  setStatus("signedout");
  if(location.protocol==="file:"){fb.err="file";render();return;}
  try{
    const [appM,authM,fsM]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)]);
    fb.mod={appM,authM,fsM};
    const app=appM.initializeApp(fb.cfg);
    fb.auth=authM.getAuth(app);
    try{fb.db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})});}
    catch(e){fb.db=fsM.getFirestore(app);}
    authM.getRedirectResult(fb.auth).catch(e=>{fb.err=e.code||"auth";render();});
    authM.onAuthStateChanged(fb.auth,onUser);
  }catch(e){fb.err="load";setStatus("device");render();}
}
function onUser(u){
  if(fb.unsub){fb.unsub();fb.unsub=null;}
  store.ref=null;store.dirty=false;
  if(!u){fb.user=null;setStatus("signedout");render();return;}
  fb.user={uid:u.uid,name:u.displayName||"",email:u.email||""};fb.err="";
  const {doc,onSnapshot}=fb.mod.fsM;
  const ref=doc(fb.db,"users",u.uid);
  let first=true;
  setStatus(navigator.onLine?"saving":"offline");render();
  fb.unsub=onSnapshot(ref,snap=>{
    if(store.writing||store.dirty)return;
    const exists=snap.exists();
    let remote=null;
    if(exists){try{remote=normalize(JSON.parse(snap.data().stateJson||"{}"));}catch(e){remote=null;}}
    if(first){
      store.ref=ref;first=false;
      if(state.owner&&state.owner!==u.uid){state=remote||defaultState();state.owner=u.uid;saveLocal();render();if(!snap.metadata.fromCache)setStatus("cloud");return;}
      state.owner=u.uid;
      if(!remote){if(state.t>0){store.dirty=true;flush();}else if(!snap.metadata.fromCache)setStatus("cloud");saveLocal();return;}
      if(remote.t>state.t){state=remote;state.owner=u.uid;saveLocal();render();}
      else if(state.t>remote.t){store.dirty=true;flush();return;}
      if(!snap.metadata.fromCache)setStatus("cloud");
      return;
    }
    if(remote&&remote.t>state.t){state=remote;state.owner=u.uid;saveLocal();render();}
    if(!snap.metadata.fromCache&&!store.dirty)setStatus("cloud");
  },err=>{fb.err=err.code==="permission-denied"?"rules":(err.code||"error");store.ref=null;setStatus("device");render();});
}
async function flush(){
  if(!store.ref||store.writing||!store.dirty)return;
  store.writing=true;store.dirty=false;
  const body=JSON.parse(JSON.stringify(state));
  if(fb.user)body.owner=fb.user.uid;
  let retry=false;
  if(!navigator.onLine)setStatus("offline");
  try{
    const {setDoc,serverTimestamp}=fb.mod.fsM;
    await setDoc(store.ref,{stateJson:JSON.stringify(body),t:body.t,updatedAt:serverTimestamp()});
    setStatus("cloud");if(fb.err==="rules"){fb.err="";renderNav();}
  }catch(e){
    if(e&&e.code==="unavailable"&&!store.retried){store.retried=true;store.dirty=true;retry=true;}
    else{fb.err=e&&e.code==="permission-denied"?"rules":(e&&e.code)||"error";setStatus("device");renderNav();}
  }
  store.writing=false;
  if(retry){setTimeout(()=>{store.retried=false;flush();},1200+Math.random()*1200);}
  else{store.retried=false;if(store.dirty){clearTimeout(store.timer);store.timer=setTimeout(flush,700);}}
}
async function signIn(){
  if(!fb.mod){if(location.protocol==="file:")fb.err="file";location.hash="sync";render();return;}
  const {GoogleAuthProvider,signInWithPopup,signInWithRedirect}=fb.mod.authM;
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(fb.auth,p);}
  catch(e){
    const code=e&&e.code||"";
    if(code==="auth/popup-blocked"||code==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(fb.auth,p);}catch(e2){fb.err=e2.code||"auth";render();}}
    else if(code!=="auth/popup-closed-by-user"&&code!=="auth/cancelled-popup-request"){fb.err=code||"auth";render();}
  }
}
async function signOutNow(){
  if(store.dirty){clearTimeout(store.timer);await flush();}
  if(fb.mod)await fb.mod.authM.signOut(fb.auth);
}

function setNode(k,patch){state.nodes[k]=Object.assign({s:0,c:0,note:""},ns(k),patch);}
function locked(n){return n.req.some(r=>sOf(n.track+"."+r)<1);}
function trackProgress(t){let sum=0,tried=0,mem=0;t.nodes.forEach(n=>{const s=sOf(n.key);sum+=s;if(s>=1)tried++;if(s===2)mem++;});return {pct:sum/(2*t.nodes.length),tried,mem,total:t.nodes.length};}
function gateKey(p,i){return `p${p}-${i}`;}
function gatesDone(p){return p.gates.filter((g,i)=>state.gates[gateKey(p.n,i)]).length;}
function allGates(){let d=0,t=0;PHASES.forEach(p=>{t+=p.gates.length;d+=gatesDone(p);});return {d,t,pct:t?d/t:0};}
function tierLabel(t,i){return (t.tiers||TIERS)[i-1];}
function stateWord(s){return ["Not started","Tried it","From memory"][s];}
function calc(){
  const p=state.profile;const bmr=10*p.wt+6.25*p.ht-5*p.age+(p.sex==="m"?5:-161);
  const tdee=Math.round(bmr*p.act/50)*50,tgt=Math.round((bmr*p.act-p.def)/50)*50,P=Math.round(1.8*p.wt),F=Math.round(0.9*p.wt),C=Math.max(0,Math.round((tgt-P*4-F*9)/4));
  const lose=Math.max(0,p.wt-p.gw),weeks=p.def>0?lose*7700/(p.def*7):Infinity;
  return {bmr,tdee,tgt,P,F,C,lose,weeks};
}

function dabba(){
  const cx=150,cy=150,N=TRACKS.length,R=N>6?95:88,r=N>6?33:40,rc=N>6?39:42,sc=r*1.35/64,parts=[];
  const defs=[];
  TRACKS.forEach((t,i)=>{
    const a=(-90+i*360/N)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),pr=trackProgress(t).pct;
    defs.push(`<clipPath id="dk-${t.id}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r-3}"/></clipPath>`);
    const h=(2*(r-3))*pr;
    parts.push(`<a href="#${t.hash}" aria-label="${esc(t.name)}, ${Math.round(pr*100)}% done"><title>${esc(t.name)}: ${Math.round(pr*100)}%</title>
     <circle class="k" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="var(--surface)" stroke="var(--steel)" stroke-width="3"/>
     <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r-3}" fill="var(--${t.id})" opacity="0.14"/>
     <rect clip-path="url(#dk-${t.id})" x="${(x-r).toFixed(1)}" y="${(y+r-3-h).toFixed(1)}" width="${2*r}" height="${h.toFixed(1)}" fill="var(--${t.id})"/>
     ${place({ni:"dal",si:"idli",ta:"kali",ko:"bibimbap",it:"pasta",de:"ladoo",es:"eggs"}[t.id],(x-32*sc).toFixed(1),(y-32*sc).toFixed(1),sc.toFixed(3))}
     <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r-3}" fill="none" stroke="var(--${t.id})" stroke-opacity="0.35" stroke-width="1.5"/></a>`);
  });
  const g=allGates(),gh=(2*(rc-3))*g.pct;
  defs.push(`<clipPath id="dk-c"><circle cx="${cx}" cy="${cy}" r="${rc-3}"/></clipPath>`);
  return `<svg class="dabba" viewBox="0 0 300 300" role="img" aria-label="Masala dabba of your progress: one katori per skill tree, the centre for roadmap gates">
   <defs>${defs.join("")}</defs>

   <circle cx="${cx}" cy="${cy}" r="136" fill="none" stroke="var(--steel)" stroke-width="1.5"/>
   ${parts.join("")}
   <a href="#roadmap" aria-label="Roadmap gates, ${g.d} of ${g.t} ticked"><title>Roadmap gates: ${g.d} of ${g.t}</title>
    <circle class="k" cx="${cx}" cy="${cy}" r="${rc}" fill="var(--surface)" stroke="var(--steel)" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="${rc-3}" fill="var(--ink)" opacity="0.08"/>
    <rect clip-path="url(#dk-c)" x="${cx-rc}" y="${(cy+rc-3-gh).toFixed(1)}" width="${2*rc}" height="${gh.toFixed(1)}" fill="var(--ink)"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="700" fill="${g.pct>0.55?"var(--paper)":"var(--ink)"}" font-family="var(--sans)">${g.d}/${g.t}</text></a>
  </svg>`;
}

function phaseNodes(p){
  const all=TRACKS.flatMap(t=>t.nodes);
  const p0=["es.knife","es.safety","es.boiled","es.omelette","ni.dal-tadka","ni.jeera-rice"];
  if(p.n===0)return p0.map(k=>NODE[k]);
  if(p.n===1)return all.filter(n=>n.t===1&&!p0.includes(n.key));
  if(p.n===4)return all.filter(n=>n.t===4&&n.chicken);
  if(p.n===5)return all.filter(n=>n.t===4&&!n.chicken);
  return all.filter(n=>n.t===p.tier);
}

    const wks=WEEKENDS.filter(x=>x.w>=Math.max(1,p.from)&&x.w<=p.to);
    return `<details class="phase ${isCur?"current":""} ${done?"done":""}" ${isCur?"open":""}>

function drawEdges(){
  const tree=document.getElementById("tree"),svg=document.getElementById("edges");
  if(!tree||!svg)return;
  if(getComputedStyle(svg).display==="none"){svg.innerHTML="";return;}
  const tb=tree.getBoundingClientRect();svg.setAttribute("viewBox",`0 0 ${tb.width} ${tb.height}`);
  const t=TRACK[tree.querySelector(".node").dataset.node.split(".")[0]];
  let out="";
  t.nodes.forEach(n=>n.req.forEach(r=>{
    const a=document.getElementById("k-"+t.id+"."+r),b=document.getElementById("k-"+n.key);if(!a||!b)return;
    const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
    const lit=sOf(t.id+"."+r)>=1,col=lit?`var(--${t.id})`:"var(--steel-2)";
    let d;
    if(Math.abs(ar.left-br.left)<8){
      const ax=ar.left-tb.left+4,ay=ar.top+ar.height/2-tb.top,bx=br.left-tb.left+4,by=br.top+br.height/2-tb.top;
      d=`M${ax} ${ay} C${ax-34} ${ay+12}, ${bx-34} ${by-12}, ${bx} ${by}`;
    }else{
      const ax=ar.right-tb.left,ay=ar.top+ar.height/2-tb.top,bx=br.left-tb.left,by=br.top+br.height/2-tb.top,mx=(ax+bx)/2;
      d=`M${ax} ${ay} C${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`;
    }
    out+=`<path d="${d}" class="${lit?"lit":""}" data-a="${t.id}.${r}" data-b="${n.key}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  }));
  svg.innerHTML=out;
}

  <h2 class="sec">How a day adds up</h2><p class="sec-lead">Monday of Week A, weighed out. Weigh portions for the first two weeks until you can eyeball them.</p>

  <tfoot><tr><td></td><td>Total</td><td class="num">${fmtN(tot[0])}</td><td class="num">${tot[1]} g</td></tr></tfoot></table></div>
  <h2 class="sec">Weekends and chicken</h2>
  <p><b>Saturday:</b> brunch at 09:00, the exploration dish from 11:00 to 14:00 (it becomes lunch), then a light dinner such as khichdi or soup with eggs. <b>Sunday:</b> brunch, the 90-minute prep from 10:30, the dessert in the afternoon, and dinner from the prep. Weekend meals can run 300–500 kcal over; the weekly average is what counts.</p>
  <p>From Phase 4, swap the paneer or egg dinner on 3 days a week for 120 g raw chicken. Keep eggs at breakfast and dal or dairy at lunch.</p>`;
}
function viewWeekends(){
  const w=planWeek();let done=0;WEEKENDS.forEach(x=>{if(state.wk[`w${x.w}s`])done++;if(state.wk[`w${x.w}d`])done++;});
  const rows=WEEKENDS.map(x=>{const n1=NODE[x.link],n2=NODE[x.dlink],k1=`w${x.w}s`,k2=`w${x.w}d`,cur=x.w===w;
   return `<tr class="wk-row ${cur?"hl":""}"><td class="num">${x.w}${cur?'<br><span class="pill">This week</span>':""}</td><td class="num">${monthOf(x.w)}</td>
    <td style="--c:var(--${x.track})"><div class="wk-dish">${art(x.art)}<div>${n1?`<button class="linkish" type="button" data-node="${n1.key}" data-k="wr-${x.w}">${esc(x.dish)}</button>`:esc(x.dish)}<br><span class="tiny">${esc(TRACK[x.track].short)}. ${esc(x.skill)}</span></div></div></td>
    <td style="--c:var(--${x.track})"><input type="checkbox" aria-label="Cooked ${esc(x.dish)}" data-wk="${k1}" data-k="wk-${k1}" ${state.wk[k1]?"checked":""}></td>
    <td style="--c:var(--de)"><div class="wk-dish">${art(x.dart)}<div>${n2?`<button class="linkish" type="button" data-node="${n2.key}" data-k="wq-${x.w}">${esc(x.des)}</button>`:esc(x.des)}<br><span class="tiny">${{N:"Nourishing",T:"Treat",E:"Either"}[x.type]}${OVEN_WEEKS.includes(x.w)?", needs an oven or air fryer":""}</span></div></div></td>
    <td style="--c:var(--de)"><input type="checkbox" aria-label="Made ${esc(x.des)}" data-wk="${k2}" data-k="wk-${k2}" ${state.wk[k2]?"checked":""}></td></tr>`;}).join("");
  return `<h1 class="title">Weekend calendar</h1>
  <p class="lead">One showpiece dish every Saturday and one make-ahead dessert every Sunday, rotating through all four cuisines and alternating nourishing and treat desserts.</p>
  <div class="row" style="margin:16px 0 18px"><span class="pill">${done} of 52 done</span><div class="bar" style="flex:1;max-width:360px"><i style="width:${Math.round(done/52*100)}%"></i></div></div>
  <div class="tbl"><table><thead><tr><th class="num">Week</th><th class="num">Month</th><th>Saturday dish</th><th>Cooked</th><th>Sunday dessert</th><th>Made</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="tiny">Weeks 9, 12, 14, 19 and 22 need an oven, OTG or air fryer for the dessert; swap in a stovetop one if you don’t have one. The pizza, tikka and Korean chicken also work in a heavy pan. If mangoes aren’t in season for weeks 22–23, use any ripe fruit.</p>`;
}
function sundayKey(){const d=today0();d.setDate(d.getDate()+((7-d.getDay())%7));return isoDate(d);}
function viewKitchen(){
  const sk=sundayKey(),arr=Array.isArray(state.prep[sk])?state.prep[sk]:[],done=PREP.filter((x,i)=>arr[i]).length;
  return `<h1 class="title">Kitchen and prep</h1>
  <p class="lead">A 90-minute Sunday prep turns every weekday meal into a 15–50 minute job. The checklist resets each week.</p>
  <div class="two" style="margin-top:12px"><section><h2 class="sec">This Sunday’s prep</h2>
   <div class="row" style="margin-bottom:6px"><span class="pill">${done} of ${PREP.length}</span><div class="bar" style="flex:1"><i style="width:${Math.round(done/PREP.length*100)}%"></i></div>${done?`<button class="btn quiet sm" type="button" data-act="prepclear" data-k="prepclear">Clear</button>`:""}</div>
   <ol class="steps checkable">${PREP.map((x,i)=>`<li><label class="check ${arr[i]?"done":""}"><input type="checkbox" data-prep="${i}" data-k="pr-${i}" ${arr[i]?"checked":""}><span>${esc(x)}</span></label></li>`).join("")}</ol></section>
   <section><h2 class="sec">Weekday cook block</h2><p class="sec-lead">50 minutes, 10:30 to 11:20.</p>
    <div class="timeline">${COOK_BLOCK.map(s=>`<div><time>${s[0]}</time>${esc(s[1])}</div>`).join("")}</div>
    <h2 class="sec">How long prepped food keeps</h2>
    <div class="tbl"><table><thead><tr><th>Food</th><th>Fridge</th><th>Freezer</th></tr></thead><tbody>${STORAGE.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></section></div>
  <h2 class="sec">Equipment</h2><p class="sec-lead">Ten tools cover Phases 0–1; buy the rest only when a phase needs it. Tick what you own.</p>
  <div class="grid">${EQUIP.map((e,i)=>`<label class="panel check" style="display:grid;grid-template-columns:auto 44px 1fr;gap:12px;align-items:center;padding:12px 14px"><input type="checkbox" data-equip="${i}" data-k="eq-${i}" ${state.equip[i]?"checked":""}>${art(e[3],"ic")}<span><b style="font-weight:600">${esc(e[0])}</b><br><span class="tiny">${esc(e[1])}. Phase ${e[2]}</span></span></label>`).join("")}</div>
  <h2 class="sec">Pantry by cuisine</h2>
  <div class="grid">${PANTRY.map(p=>`<div class="panel" style="--c:var(--${p[1]});border-top:4px solid var(--c)"><h3>${esc(p[0])}</h3><p class="small muted" style="margin:0">${esc(p[2])}</p></div>`).join("")}</div>
  <div class="note" style="--c:var(--ko)"><b>Check labels.</b> Most shop kimchi contains fish sauce or salted shrimp, and parmesan is usually made with animal rennet. Look for vegetarian versions.</div>`;
}
function viewProgress(){
  const p=state.profile,cl=calc(),log=[...state.log].map((e,i)=>({...e,i})).sort((a,b)=>a.d<b.d?-1:1);
  const last=log.at(-1),first=log[0];
  let rate=null;
  if(log.length>=3&&last){const cut=parseIso(last.d).getTime()-21*DAY;const pts=log.filter(e=>parseIso(e.d).getTime()>=cut);
    if(pts.length>=3){const xs=pts.map(e=>parseIso(e.d).getTime()/DAY),ys=pts.map(e=>Number(e.w));const span=Math.max(...xs)-Math.min(...xs);
     if(span>=7){const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2;});rate=de?nu/de*7:null;}}}
  let advice="Log at least three weigh-ins across a week or more to see your trend.",ruleIdx=-1;
  if(rate!==null){if(rate>-0.2){ruleIdx=1;}else if(rate<-0.8){ruleIdx=2;}else{ruleIdx=0;}advice=`You’re ${rate<0?"losing":"gaining"} about ${Math.abs(rate).toFixed(2)} kg a week. ${RULES[ruleIdx][1]}.`;}
  return `<h1 class="title">Weight and waist</h1>
  <p class="lead">Judge progress by two-week trends in weight, waist and strength, then change calories in 150 kcal steps.</p>
  <form class="panel log-form" id="logForm" style="margin-top:18px">
   <label class="field">Date<input type="date" name="d" value="${isoDate(today0())}" required data-k="lf-d"></label>
   <label class="field">Weight (kg)<input type="number" name="w" step="0.1" min="30" max="200" required placeholder="${last?Number(last.w).toFixed(1):p.wt}" data-k="lf-w"></label>
   <label class="field">Waist at navel (cm)<input type="number" name="wa" step="0.5" min="40" max="200" placeholder="Optional" data-k="lf-wa"></label>
   <button class="btn" type="submit" data-k="lf-s">Add weigh-in</button><p class="tiny" id="logErr" role="alert" style="margin:0;flex-basis:100%"></p></form>
  <div class="stats" style="margin:22px 0 8px">
   <div class="stat"><b>${first?Number(first.w).toFixed(1):p.wt}</b><span>kg at start</span></div>
   <div class="stat"><b>${last?Number(last.w).toFixed(1):"–"}</b><span>kg latest</span></div>
   <div class="stat"><b>${first&&last?(last.w-first.w>0?"+":last.w-first.w<0?"−":"")+Math.abs(last.w-first.w).toFixed(1):"–"}</b><span>kg change</span></div>
   <div class="stat"><b>${p.gw}</b><span>kg goal</span></div></div>
  <div class="note" style="--c:var(--${ruleIdx===0?"si":ruleIdx<0?"es":"ni"})">${esc(advice)}</div>
  <div class="panel chart" style="margin-top:12px">${weightChart(log,cl)}</div>
  ${log.length?`<h2 class="sec">Your weigh-ins</h2><div class="tbl"><table><thead><tr><th>Date</th><th class="num">Plan week</th><th class="num">Weight</th><th class="num">Waist</th><th></th></tr></thead><tbody>${[...log].reverse().map(e=>`<tr><td>${esc(fmtDay(parseIso(e.d)))}</td><td class="num">${planWeek(parseIso(e.d))}</td><td class="num">${Number(e.w).toFixed(1)} kg</td><td class="num">${e.wa?Number(e.wa).toFixed(1)+" cm":"–"}</td><td style="text-align:right"><button class="btn quiet sm" type="button" data-act="logdel" data-i="${e.i}" data-k="ld-${e.i}">Delete</button></td></tr>`).join("")}</tbody></table></div>`:""}
  <h2 class="sec">When to adjust</h2>
  <div class="tbl"><table><thead><tr><th>If, over two weeks…</th><th>Then</th></tr></thead><tbody>${RULES.map((r,i)=>`<tr class="${i===ruleIdx?"hl":""}"><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>
  <h2 class="sec">Habits that make the numbers honest</h2>
  <ul class="small" style="max-width:70ch;padding-left:20px;line-height:1.7"><li>Weigh 3–7 mornings a week after the toilet and use the weekly average.</li><li>Measure your waist at the navel every Sunday and take photos every two weeks.</li><li>Log your key calisthenics numbers; steady or rising means you’re keeping muscle.</li><li>Log food in any tracking app for the first 3–4 weeks, then spot-check one day a week.</li><li>Consider a baseline blood test (B12, vitamin D, ferritin, lipids) and repeat it in six months.</li></ul>`;
}
function weightChart(log,cl){
  const p=state.profile,W=720,H=280,x0=52,x1=W-70,y0=18,y1=H-40;
  const st=planStart().getTime(),wk=t=>(t-st)/(7*DAY),rateKg=p.def*7/7700;
  const goalWeeks=rateKg>0?Math.max(0,(p.wt-p.gw)/rateKg):26,planFrom=1,goalW=planFrom+goalWeeks;
  const ws_=log.map(e=>wk(parseIso(e.d).getTime()));
  const wMin=Math.min(0,...ws_.map(Math.floor)),wMax=Math.max(26,Math.ceil(goalW)+1,...ws_.map(v=>Math.ceil(v)+1));
  const ws=log.map(e=>Number(e.w));
  const vMin=Math.floor(Math.min(p.gw-1,...ws)),vMax=Math.ceil(Math.max(p.wt+1,...ws));
  const X=v=>x0+(v-wMin)/(wMax-wMin)*(x1-x0),Y=v=>y1-(v-vMin)/(vMax-vMin)*(y1-y0);
  let g="";const step=(vMax-vMin)>10?2:1;
  for(let v=vMin;v<=vMax;v+=step)g+=`<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${x0-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--ink-3)">${v}</text>`;
  const tick=wMax-wMin>40?8:4;
  for(let v=Math.ceil(wMin/tick)*tick;v<=wMax;v+=tick)g+=`<text x="${X(v)}" y="${y1+22}" text-anchor="middle" font-size="12" fill="var(--ink-3)">${v===0?"Week 0":"Wk "+v}</text><line x1="${X(v)}" x2="${X(v)}" y1="${y1}" y2="${y1+5}" stroke="var(--steel-2)"/>`;
  const plan=`<path d="M${X(planFrom)} ${Y(p.wt)} L${X(goalW)} ${Y(p.gw)} L${X(wMax)} ${Y(p.gw)}" fill="none" stroke="var(--steel-2)" stroke-width="2" stroke-dasharray="6 6"/><text x="${(X(planFrom)+X(goalW))/2+10}" y="${(Y(p.wt)+Y(p.gw))/2-10}" font-size="12" fill="var(--ink-2)">Plan, ${rateKg.toFixed(2)} kg a week</text>`;
  const goal=`<line x1="${x0}" x2="${x1}" y1="${Y(p.gw)}" y2="${Y(p.gw)}" stroke="var(--si)" stroke-width="1.5"/><text x="${x1+6}" y="${Y(p.gw)+4}" font-size="12" font-weight="600" fill="var(--ink)">Goal ${p.gw}</text>`;
  let avg="";
  if(log.length>1){const pts=log.map(e=>{const t=parseIso(e.d).getTime();const win=log.filter(f=>{const u=parseIso(f.d).getTime();return u<=t&&u>t-7*DAY;});return [X(wk(t)),Y(win.reduce((a,f)=>a+Number(f.w),0)/win.length)];});
    avg=`<path d="${pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`;}
  const dots=log.map(e=>{const t=parseIso(e.d).getTime();return `<circle cx="${X(wk(t)).toFixed(1)}" cy="${Y(Number(e.w)).toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"><title>Week ${Math.floor(wk(t))}: ${Number(e.w).toFixed(1)} kg</title></circle>`;}).join("");
  const title=log.length?`${log.length} weigh-in${log.length>1?"s":""} by plan week; the solid line is your 7-day average`:"Your planned path to the goal by plan week; add a weigh-in to start your line";
  return `<h3>${esc(title)}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight by plan week against the plan and goal">${g}${goal}${plan}${avg}${dots}<text x="${x0-30}" y="${(y0+y1)/2}" text-anchor="middle" font-size="12" fill="var(--ink-3)" transform="rotate(-90 ${x0-30} ${(y0+y1)/2})">kg</text></svg>`;
}

/* ---------- events ---------- */
function hlEdges(key){const svg=document.getElementById("edges");if(!svg)return;svg.classList.toggle("focus",!!key);svg.querySelectorAll("path").forEach(p=>p.classList.toggle("on",!!key&&(p.dataset.a===key||p.dataset.b===key)));}
document.addEventListener("pointerover",e=>{const n=e.target.closest&&e.target.closest(".tree .node");hlEdges(n?n.dataset.node:null);});
document.addEventListener("focusin",e=>{const n=e.target.closest&&e.target.closest(".tree .node");hlEdges(n?n.dataset.node:null);});
document.addEventListener("click",e=>{
  const nb=e.target.closest("[data-node]");if(nb){openNode(nb.dataset.node);return;}
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="close"){$("#dlg").close();return;}
    if(act==="state"&&ui.dlgKey){setNode(ui.dlgKey,{s:Number(a.dataset.v)});commit();return;}
    if(act==="cook"&&ui.dlgKey){const c=Math.max(0,(Number(ns(ui.dlgKey).c)||0)+Number(a.dataset.d));const patch={c};if(c>0&&sOf(ui.dlgKey)===0)patch.s=1;setNode(ui.dlgKey,patch);commit();return;}
    if(act==="menuw"){ui.menuWeek=a.dataset.v;render();return;}
    if(act==="psort"){ui.psort=a.dataset.v;render();return;}
    if(act==="sex"){state.profile.sex=a.dataset.v;commit();return;}
    if(act==="logdel"){const i=Number(a.dataset.i);state.log.splice(i,1);commit();return;}
    if(act==="prepclear"){delete state.prep[sundayKey()];commit();return;}
    if(act==="shiftweek"){const dlt=Number(a.dataset.d)||0,w=planWeek();if((dlt<0&&w<=0)||(dlt>0&&w>=27))return;const st=planStart();st.setDate(st.getDate()-7*dlt);state.start=isoDate(st);commit();return;}
    if(act==="signin"){signIn();return;}
    if(act==="signout"){signOutNow();return;}
    if(act==="savecfg"){const c=parseConfig(($("#cfgBox")||{}).value||"");if(!c){$("#cfgErr").textContent=errText("config");return;}try{localStorage.setItem(FB_CFG_KEY,JSON.stringify(c));}catch(err){$("#cfgErr").textContent="This browser won’t store the config; set FIREBASE_CONFIG in the file instead.";return;}location.reload();return;}
    if(act==="clearcfg"){(async()=>{try{await signOutNow();}catch(err){}try{localStorage.removeItem(FB_CFG_KEY);}catch(err){}location.reload();})();return;}
    if(act==="copyrules"){const m=$("#copyMsg");(navigator.clipboard?navigator.clipboard.writeText(RULES_TXT):Promise.reject()).then(()=>{m.textContent="Copied";},()=>{m.textContent="Select the rules above and copy them";});return;}
    if(act==="clearlocal"){if(confirm("Remove all progress saved in this browser? Anything already synced to your Google account stays there.")){try{localStorage.removeItem(LS_KEY);}catch(err){}state=defaultState();render();}return;}
  }
  const rl=e.target.closest(".rail a");if(rl){$("#rail").classList.remove("open");$("#navToggle").setAttribute("aria-expanded","false");}
});
$("#navToggle").addEventListener("click",()=>{const r=$("#rail"),o=!r.classList.contains("open");r.classList.toggle("open",o);$("#navToggle").setAttribute("aria-expanded",String(o));});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.gate){state.gates[t.dataset.gate]=t.checked;commit();return;}
  if(t.dataset.wk){state.wk[t.dataset.wk]=t.checked;
    const wd=WEEKENDS.find(x=>`w${x.w}s`===t.dataset.wk||`w${x.w}d`===t.dataset.wk);
    if(t.checked&&wd){const k=t.dataset.wk.endsWith("s")?wd.link:wd.dlink;if(k&&NODE[k]&&sOf(k)===0)setNode(k,{s:1,c:Math.max(1,Number(ns(k).c)||0)});}
    commit();return;}
  if(t.dataset.prep!==undefined){const sk=sundayKey();const arr=Array.isArray(state.prep[sk])?state.prep[sk].slice():[];arr[Number(t.dataset.prep)]=t.checked;
    const keep={};Object.keys(state.prep).sort().slice(-3).forEach(k=>keep[k]=state.prep[k]);keep[sk]=arr;state.prep=keep;commit();return;}
  if(t.dataset.equip!==undefined){state.equip[t.dataset.equip]=t.checked;commit();return;}
  if(t.dataset.prof){const k=t.dataset.prof;state.profile[k]=Number(t.value);commit(false);updateCalc();renderNav();return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.prof&&t.type==="range"){state.profile[t.dataset.prof]=Number(t.value);updateCalc();return;}
  if(t.dataset.note){const k=t.dataset.note;setNode(k,{note:t.value.slice(0,4000)});clearTimeout(ui.noteTimer);ui.noteTimer=setTimeout(()=>commit(false),600);}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="logForm")return;e.preventDefault();
  const f=new FormData(e.target),d=String(f.get("d")||""),w=Number(f.get("w")),wa=f.get("wa")?Number(f.get("wa")):null;
  const err=$("#logErr");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){err.textContent="Pick a date for this weigh-in.";return;}
  if(!(w>=30&&w<=200)){err.textContent="Enter your weight in kg, between 30 and 200.";return;}
  const ex=state.log.findIndex(x=>x.d===d);const entry={d,w:Math.round(w*10)/10};if(wa)entry.wa=Math.round(wa*2)/2;
  if(ex>=0)state.log[ex]=entry;else state.log.push(entry);commit();
});
$("#dlg").addEventListener("close",()=>{ui.dlgKey=null;render();});
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close();});
window.addEventListener("hashchange",()=>{if($("#dlg").open)$("#dlg").close();render();window.scrollTo(0,0);});
let rsz;if(window.ResizeObserver){new ResizeObserver(()=>{cancelAnimationFrame(rsz);rsz=requestAnimationFrame(drawEdges);}).observe($("#main"));}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(drawEdges));
render();
initFirebase();

</script>
