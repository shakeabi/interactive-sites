<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four strings to six</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F2FA;--surface:#FFFFFF;--surface2:#EEE9F6;--surface3:#E3DCEF;--ink:#1F1433;--muted:#5E5472;--line:rgba(31,20,51,.10);--line2:rgba(31,20,51,.24);
  --stage:#1F1433;--pink:#C8265F;--pink-ink:#9C1949;--pink-wash:#FBE4EC;--on-pink:#FFFFFF;
  --mari:#F2A93B;--mari-ink:#7A4B00;--mari-wash:#FDEED3;
  --leaf:#13876F;--leaf-wash:#D7F1E8;--indi:#4A3AAE;--indi-wash:#E8E4FB;--danger:#B3261E;
  --display:"Unbounded","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --sidew:236px;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#130D1D;--surface:#1D1529;--surface2:#281E37;--surface3:#342846;--ink:#F3EEFA;--muted:#B6ABC9;--line:rgba(243,238,250,.10);--line2:rgba(243,238,250,.28);
  --stage:#261A3A;--pink:#FF5C8D;--pink-ink:#FF93B4;--pink-wash:rgba(255,92,141,.16);--on-pink:#2A0716;
  --mari:#FFC35E;--mari-ink:#FFD58C;--mari-wash:rgba(255,195,94,.15);
  --leaf:#43D3B0;--leaf-wash:rgba(67,211,176,.14);--indi:#BAAFFF;--indi-wash:rgba(186,175,255,.14);--danger:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#130D1D;--surface:#1D1529;--surface2:#281E37;--surface3:#342846;--ink:#F3EEFA;--muted:#B6ABC9;--line:rgba(243,238,250,.10);--line2:rgba(243,238,250,.28);
  --stage:#261A3A;--pink:#FF5C8D;--pink-ink:#FF93B4;--pink-wash:rgba(255,92,141,.16);--on-pink:#2A0716;
  --mari:#FFC35E;--mari-ink:#FFD58C;--mari-wash:rgba(255,195,94,.15);
  --leaf:#43D3B0;--leaf-wash:rgba(67,211,176,.14);--indi:#BAAFFF;--indi-wash:rgba(186,175,255,.14);--danger:#FF8A80;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.62 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
::selection{background:var(--mari-wash)}
.ic{width:18px;height:18px;flex:none}

/* ---------- app shell: sidebar on desktop, top bar and bottom tabs on phones ---------- */
.shell{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1.75rem;padding:1.5rem .9rem 1.1rem;border-right:1px solid var(--line)}
.brand{font:700 .95rem/1.15 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:.65rem;text-decoration:none;padding:0 .55rem}
.brand svg{flex:none}
.brand svg line{stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;transform-box:fill-box}
.brand svg line:nth-child(-n+4){stroke:var(--pink)}
@keyframes twang{from{transform:translateY(-.7px)}to{transform:translateY(.7px)}}
body.audio-on .brand svg line{animation:twang .08s linear infinite alternate}
body.audio-on .brand svg line:nth-child(even){animation-delay:.04s}
nav.tabs{display:flex;flex-direction:column;gap:.2rem}
nav.tabs a{display:flex;align-items:center;gap:.8rem;padding:.65rem .8rem;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.98rem;transition:background .12s,color .12s}
nav.tabs a svg{width:21px;height:21px;flex:none}
nav.tabs a:hover{background:var(--surface2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.side-foot{margin-top:auto;display:grid;gap:.8rem}
.sync{display:flex;gap:.5rem;align-items:flex-start;font-size:.82rem;color:var(--muted);padding:0 .55rem;line-height:1.35}
.dotst{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:.35rem}
.dotst.ok{background:var(--leaf)}
.acct{display:flex;align-items:center;gap:.55rem;padding:.5rem .55rem;border-radius:16px;background:var(--surface2)}
.acct:empty{display:none}
.acct img,.acct .avatar{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover}
.acct .avatar{display:grid;place-items:center;background:var(--indi-wash);color:var(--indi);font-weight:800;font-size:.85rem}
.acct-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.acct button{min-height:32px;padding:.25rem .7rem;font-size:.85rem}
main{min-width:0;width:100%;max-width:1120px;margin:0 auto;padding:2.25rem 2.25rem 4rem}
body.has-dock main{padding-bottom:8rem}
.view{display:none}.view.on{display:block}
body.locked .shell{display:block}
body.locked .side{display:none}
body.locked main{max-width:820px;padding-top:2.5rem}
@media (max-width:900px){
  .shell{display:block}
  .side{height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1rem;border-right:0;border-bottom:1px solid var(--line);z-index:9;background:var(--paper)}
  .brand{padding:0}
  .side-foot{margin:0}
  .sync{display:none}
  .acct{padding:.2rem .3rem .2rem .2rem;background:transparent}
  .acct-name{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;flex-direction:row;gap:0;padding:.3rem .35rem calc(.3rem + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
  nav.tabs a{flex:1 1 0;min-width:0;flex-direction:column;gap:.12rem;padding:.4rem .1rem .3rem;font-size:.68rem;border-radius:12px;text-align:center}
  nav.tabs a:hover{background:transparent}
  nav.tabs a[aria-current="page"]{background:transparent;color:var(--pink)}
  main{padding:1.25rem 1rem 6.5rem}
  body.has-dock main{padding-bottom:11rem}
  body.locked main{padding-top:1.25rem}
}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;letter-spacing:-.025em;font-weight:700}
h1{font-size:clamp(1.7rem,4.2vw,2.7rem);max-width:22ch;line-height:1.08}
h2{font-size:clamp(1.15rem,2.2vw,1.4rem)}
h3{font-size:1.02rem;font-weight:600;letter-spacing:-.015em}
h4{font:800 .95rem/1.3 var(--body);margin:1.35rem 0 .4rem;color:var(--ink)}
p{margin:.45rem 0 0;max-width:68ch}
.lede{color:var(--muted);font-size:1.1rem;margin-top:.7rem}
.sub{color:var(--muted);font-size:.93rem;margin:.15rem 0 0}
.note{color:var(--muted);font-size:.92rem}
.warn{color:var(--danger);font-size:.92rem;margin-top:.4rem}
.pagehead{margin-bottom:1.5rem}
.sec{margin-top:3rem}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:.75rem 1.5rem;margin-bottom:1rem}
.sec-h p{color:var(--muted);margin-top:.35rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface2);padding:.05rem .35rem;border-radius:5px}

/* ---------- surfaces and grids ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:1.3rem 1.4rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1rem;align-items:start}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:.5rem 2.25rem}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem;align-items:start}
.b3{grid-column:span 3}.b4{grid-column:span 4}.b5{grid-column:span 5}.b6{grid-column:span 6}.b7{grid-column:span 7}.b8{grid-column:span 8}.b12{grid-column:span 12}
.stack{display:grid;gap:1rem}
@media (max-width:980px){.bento>*{grid-column:1/-1}}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* ---------- controls ---------- */
button,.btn{font:700 .95rem/1.2 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:.5rem 1.05rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;min-height:40px;transition:background .12s,border-color .12s,transform .08s}
button:hover,.btn:hover{background:var(--surface2);border-color:var(--ink)}
button:active,.btn:active{transform:scale(.98)}
.btn-main{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.btn-main:hover{background:var(--pink-ink);border-color:var(--pink-ink);color:var(--on-pink)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn-quiet:hover{background:var(--surface2);border-color:transparent;color:var(--ink)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.38);color:#FFFFFF}
.btn-ghost:hover{background:rgba(255,255,255,.12);border-color:#FFFFFF}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.big{min-height:50px;padding:.65rem 1.4rem;font-size:1.02rem}
:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;min-height:34px;padding:.3rem .9rem}
.seg button:hover{background:var(--surface3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.subtabs{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin:0 0 1.25rem;padding:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;min-height:42px;padding:.5rem 1.1rem;border-color:var(--line)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:.78rem;font-weight:800;padding:.14rem .62rem;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ta{background:var(--mari-wash);color:var(--mari-ink)}
.tag.en{background:var(--indi-wash);color:var(--indi)}
.tag.ok{background:var(--leaf-wash);color:var(--leaf)}
.tag.hard{background:var(--pink-wash);color:var(--pink-ink)}
.chk{display:flex;gap:.7rem;align-items:flex-start;padding:.45rem 0;cursor:pointer;line-height:1.45}
.chk input{width:1.2rem;height:1.2rem;margin:.15rem 0 0;accent-color:var(--leaf);flex:none;cursor:pointer}
.chk.done>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.chk b{font-weight:800}
input[type=text],input[type=number],input[type=date],select{font:400 1rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:.5rem .8rem;min-height:46px;width:100%}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,select:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 3px var(--pink-wash)}
input[type=range]{width:100%;accent-color:var(--pink)}
.f{display:block;font-size:.86rem;color:var(--muted);font-weight:800;margin-bottom:.3rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:.75rem;margin-top:.9rem}
.bar{display:block;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:4px}
.ring .rt{stroke:var(--surface2)}
.ring .rp{stroke:var(--leaf)}
.ring.on-dark .rt{stroke:rgba(255,255,255,.14)}
.ring.on-dark .rp{stroke:#FFC35E}
.ringwrap{position:relative;display:inline-grid;place-items:center}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ringtxt b{font:700 1.5rem/1 var(--display);letter-spacing:-.03em}
.ringtxt span{font-size:.78rem;color:var(--muted)}

/* ---------- today: stage card ---------- */
.stagecard{background:var(--stage);color:#F6F1FC;border-radius:30px;padding:1.9rem 1.9rem 1.5rem}
.stagecard h1{color:#FFFFFF}
.stagecard .kicker{color:#FFC35E;font-weight:800;font-size:.9rem;margin:0 0 .55rem}
.stagecard .lede,.stagecard .note,.stagecard .sub{color:#CFC4E2}
.stagecard .warn{color:#FFB4AB}
.stagecard .btn-quiet{color:#D9CFEA}
.stagecard .btn-quiet:hover{background:rgba(255,255,255,.12);color:#FFFFFF}
.stagecard .panel{color:var(--ink)}
.stagecard .panel p{color:var(--ink)}
.stagecard-top{display:flex;justify-content:space-between;gap:1.5rem;align-items:flex-start}
.stagecard-stats{text-align:center;flex:none}
.stagecard-stats .ringtxt span,.stagecard-stats p{color:#CFC4E2;font-size:.82rem;margin:.3rem 0 0}
@media (max-width:620px){.stagecard{padding:1.3rem 1.1rem 1.1rem;border-radius:24px}.stagecard-stats{display:none}}
.neck{margin-top:1.6rem}
.neck svg{display:block;width:100%;height:auto;overflow:visible}
.neck .mk{cursor:pointer}
.neck .mk:focus{outline:none}
.neck .mk:focus-visible .ring,.neck .mk:hover .ring{stroke:#FFFFFF;stroke-width:3}
.neck .mk text{font:700 17px var(--display);text-anchor:middle}
.neck-top{display:grid;grid-template-columns:3fr 4fr;text-align:center;font-weight:800;font-size:.84rem;color:#CFC4E2;margin-bottom:.5rem}
.neck-l{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:.65rem;text-align:center;font-size:.82rem;color:#B9ADCF;line-height:1.3}
.neck-l b{display:block;color:#FFFFFF;font-weight:700;font-size:.88rem}
.neck-l .cur b{color:#FFC35E}
@media (max-width:620px){.neck-l span{display:none}.neck-l b{font-size:.72rem}}
.chips{display:flex;gap:.6rem;margin:1rem 0;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:901px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:none;display:flex;align-items:baseline;gap:.45rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.6rem 1rem;font-size:.92rem;color:var(--muted);min-height:0;font-weight:400}
.chip b{font:700 1.15rem var(--display);color:var(--ink);letter-spacing:-.02em}
.chip-btn{align-items:center;color:var(--ink);font-weight:700;cursor:pointer}
.chip-btn .ic{color:var(--pink)}
.songnow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:1rem;align-items:center}
.cover{display:block;width:100%;height:auto;border-radius:18px}

/* ---------- equaliser meter, chord diagrams, pads ---------- */
.meter{display:flex;align-items:flex-end;gap:4px;height:30px;margin-top:.9rem}
.meter i{flex:1;border-radius:4px 4px 2px 2px;background:var(--surface2)}
.meter i:nth-child(1){height:28%}.meter i:nth-child(2){height:36%}.meter i:nth-child(3){height:44%}.meter i:nth-child(4){height:52%}.meter i:nth-child(5){height:60%}
.meter i:nth-child(6){height:68%}.meter i:nth-child(7){height:76%}.meter i:nth-child(8){height:84%}.meter i:nth-child(9){height:92%}.meter i:nth-child(10){height:100%}
.meter i.on{background:var(--leaf)}
.meter i.on:nth-child(n+8){background:var(--mari)}
.chords{display:flex;flex-wrap:wrap;gap:.4rem .55rem;margin-top:.3rem}
.cd{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.4rem .45rem .5rem;border-radius:14px;border:1px solid transparent;background:transparent;min-height:0}
.cd:hover{background:var(--surface2);border-color:var(--line)}
.cd b{font:600 .9rem/1.1 var(--display)}
svg.dg line{stroke:var(--muted)}
svg.dg .nut{stroke:var(--ink)}
svg.dg .dot{fill:var(--ink)}
svg.dg .hi{fill:var(--pink)}
svg.dg .open{fill:none;stroke:var(--ink)}
svg.dg text{fill:var(--muted);font:700 11px var(--body)}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.slot small{display:block;text-align:center;color:var(--muted);font-size:.78rem;font-weight:800;margin-bottom:4px}
.slot div{border-radius:14px;height:60px;display:flex;align-items:center;justify-content:center;font:600 1.05rem var(--display);background:var(--surface2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--line);transition:background .05s,box-shadow .05s,transform .05s}
.slot:nth-child(odd) div{background:var(--surface3)}
.slot div.on{background:var(--mari);color:#241400;box-shadow:0 0 0 4px var(--mari-wash),inset 0 -3px 0 rgba(0,0,0,.12);transform:translateY(1px)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;font-size:.86rem;color:var(--muted);margin-top:.7rem}
.legend b{color:var(--ink);font-weight:800}

/* ---------- session runner ---------- */
.runner .now{display:grid;gap:.35rem}
.runner .clock{font:700 clamp(2.6rem,8vw,3.6rem)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.runner .now .bar i{background:var(--mari)}
.blocks{list-style:none;margin:.9rem 0 0;padding:0;display:grid;gap:3px}
.blocks li{display:grid;grid-template-columns:1fr auto;gap:1rem;padding:.6rem .8rem;border-radius:14px}
.blocks li .t{font-weight:800}
.blocks li .d{color:var(--muted);font-size:.93rem;grid-column:1/-1}
.blocks li.cur{background:var(--mari-wash)}
.blocks li.past{color:var(--muted)}
.blocks li.past .t{text-decoration:line-through}
.blocks .m{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- roadmap timeline ---------- */
.tl-item{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:1rem;position:relative;padding-bottom:1rem}
.tl-item::before{content:"";position:absolute;left:calc(1.5rem - 1px);top:3rem;bottom:0;width:2px;background:var(--line2)}
.tl-item:last-child::before{display:none}
.tl-item.done::before{background:var(--leaf)}
.tl-node{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--display);background:var(--surface2);color:var(--muted);position:relative;z-index:1}
.tl-item.cur .tl-node{background:var(--mari);color:#241400;box-shadow:0 0 0 5px var(--mari-wash)}
.tl-item.done .tl-node{background:var(--leaf);color:var(--paper)}
.tl-card{padding:0;overflow:hidden}
.tl-item.cur .tl-card{border-color:var(--mari)}
.stage-h{width:100%;display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1.1rem 1.3rem;border:0;border-radius:0;background:none;text-align:left;min-height:0;font-weight:400}
.stage-h:hover{background:var(--surface2);border:0}
.stage-h:active{transform:none}
.stage-h-main{display:grid;gap:.3rem;min-width:0}
.st-title{font:600 1.08rem/1.2 var(--display);letter-spacing:-.015em}
.stage-h-side{display:flex;align-items:center;gap:.5rem;flex:none}
.stage-h .chev{font-size:1.4rem;color:var(--muted);transition:transform .15s}
.stage-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.stage-b{padding:.4rem 1.3rem 1.5rem;border-top:1px solid var(--line)}
@media (max-width:620px){.tl-item{grid-template-columns:2.2rem minmax(0,1fr);gap:.6rem}.tl-node{width:2.2rem;height:2.2rem;font-size:.82rem}.tl-item::before{left:calc(1.1rem - 1px);top:2.2rem}.stage-h{padding:.9rem 1rem}.stage-b{padding:.3rem 1rem 1.2rem}}
.weeks{display:grid;gap:.1rem}
.pairs{display:flex;flex-wrap:wrap;gap:1rem 1.75rem;margin-top:.4rem}
.pair{display:flex;align-items:center;gap:.4rem}
.pair .arrow{color:var(--muted);font-size:1.2rem}
.singnote{background:var(--pink-wash);border-radius:16px;padding:.75rem 1rem;margin-top:1.1rem;color:var(--ink)}

/* ---------- songs: record tiles, detail, library rows ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:.6rem}
.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:.1rem;text-align:left;padding:.65rem;border-radius:24px;border:1px solid transparent;background:transparent;min-height:0;font-weight:400}
.tile:hover{background:var(--surface);border-color:var(--line)}
.tile.sel{background:var(--surface);border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-wash)}
.tile-cover{position:relative;display:block;margin-bottom:.5rem}
.tile-cover.add{aspect-ratio:1;border-radius:18px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--muted)}
.tile-cover.add .ic{width:30px;height:30px}
.tile-badge{position:absolute;left:.5rem;top:.5rem;background:#FFC35E;color:#241400;font-size:.72rem;font-weight:800;padding:.12rem .55rem;border-radius:999px}
.tile-t{font-weight:800;line-height:1.25}
.tile-a{color:var(--muted);font-size:.88rem}
.tile-p{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted);margin-top:.4rem;font-weight:700}
.tile-p .bar{flex:1;height:6px}
.detail{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:2rem;margin-top:1rem}
@media (max-width:980px){.detail{grid-template-columns:1fr;gap:1.25rem}}
.detail-cover{max-width:200px}
.next{padding:.85rem 1rem;border-radius:18px;background:var(--surface2);display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next p,.next .sub{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.acts .btn,.acts button{min-height:38px;padding:.35rem .9rem;font-size:.9rem}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:.2rem .8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .cover{border-radius:11px}
.srow-t{font-weight:800;line-height:1.3}
.srow .sub{margin:0}
.srow-x{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;justify-content:flex-end}
.srow-x button{min-height:32px;padding:.25rem .85rem;font-size:.88rem}
@media (max-width:620px){.srow{grid-template-columns:44px minmax(0,1fr)}.srow-x{grid-column:2;justify-content:flex-start}}

/* ---------- singing ---------- */
.sargam{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:.8rem}
.sargam div{text-align:center;border-radius:12px;padding:.45rem 0;background:var(--surface2)}
.sargam div b{display:block;font:600 .92rem var(--display)}
.sargam div small{color:var(--muted);font-size:.76rem;font-weight:700}
.sargam div.on{background:var(--mari);color:#241400;box-shadow:0 0 0 4px var(--mari-wash)}
.sargam div.on small{color:#241400}
.piano-wrap{overflow-x:auto;margin-top:1rem;padding-bottom:.5rem}
.piano{--wk:36px;--bk:22px;position:relative;display:flex;height:160px;padding-left:1px}
.piano button{min-height:0;padding:0;transition:background .08s}
.piano button:active{transform:translateY(2px)}
.piano .wk{flex:none;width:var(--wk);height:100%;margin-left:-1px;border:1px solid #CFC6DA;border-radius:0 0 9px 9px;background:#FCFBFE;color:#4A4058;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;font:800 .66rem var(--body);box-shadow:inset 0 -6px 0 #EFEBF5}
.piano .wk:hover{background:#F1EDF7;border-color:#CFC6DA}
.piano .bk{position:absolute;top:0;width:var(--bk);height:60%;background:#241A31;border:0;border-radius:0 0 6px 6px;z-index:2;box-shadow:inset 0 -5px 0 #3A2E4B}
.piano .bk:hover{background:#3A2E4B}
.piano .wk.in{background:#D3F2E8;box-shadow:inset 0 -6px 0 #B5E6D6}
.piano .wk.end{background:#13876F;color:#FFFFFF;border-color:#13876F;box-shadow:inset 0 -6px 0 #0E6E5A}
.piano .bk.in{background:#1C6B5B}
.piano .bk.end{background:#2BB596}

/* ---------- strum trainer as a player ---------- */
.player-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:1.25rem;align-items:stretch}
@media (max-width:760px){.player-top{grid-template-columns:1fr}}
.nowchord{display:flex;align-items:center;gap:1.25rem;min-height:140px;padding:.75rem 1.25rem;border-radius:22px;background:var(--stage);color:#F6F1FC}
.nowchord .name{font:700 2.6rem/1 var(--display);letter-spacing:-.03em;color:#FFFFFF}
.nowchord .sub,.nowchord .note{color:#CFC4E2}
.nowchord svg.dg line{stroke:#B9ADCF}
.nowchord svg.dg .nut{stroke:#FFFFFF}
.nowchord svg.dg .dot{fill:#FFC35E}
.nowchord svg.dg .open{stroke:#FFFFFF}
.nowchord svg.dg text{fill:#B9ADCF}
.player-ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.25rem;align-items:center;margin-top:1.25rem;padding:1rem 1.1rem;border-radius:22px;background:var(--surface2)}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--pink);color:var(--on-pink);border:0;font-weight:800;font-size:1rem;min-height:0;padding:0}
.playbtn:hover{background:var(--pink-ink);color:var(--on-pink);border:0}
.capo-opts{display:grid;gap:.5rem;margin-top:.75rem}
.capo-opt{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.7rem .9rem;border-radius:16px;background:var(--surface2);flex-wrap:wrap}
.capo-opt b{font-family:var(--display);font-weight:600}
.strings{display:flex;flex-wrap:wrap;gap:.5rem}
.strings button{width:64px;height:64px;border-radius:50%;padding:0;font:600 1rem var(--display);flex-direction:column;gap:0;min-height:0}
.strings button small{font:700 .62rem var(--body);color:var(--muted)}

/* ---------- progress ---------- */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1rem 1.1rem}
.stat b{display:block;font:700 1.8rem/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{color:var(--muted);font-size:.92rem}
.stat-ring{display:flex;align-items:center;gap:1rem}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.heatwrap{overflow-x:auto;padding-bottom:.25rem}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:4px}
.heat i{border-radius:4px;background:var(--surface2)}
.heat i.l1{background:var(--leaf-wash);box-shadow:inset 0 0 0 1px var(--leaf)}
.heat i.l2{background:color-mix(in srgb,var(--leaf) 60%,transparent)}
.heat i.l3{background:var(--leaf)}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,120px) auto;gap:1rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}

/* ---------- now-playing dock ---------- */
.dock{position:fixed;left:var(--sidew);right:0;bottom:0;z-index:8;padding:0 1rem calc(1rem + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock[hidden]{display:none}
body.locked .dock{display:none}
.dock-in{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--stage);color:#F6F1FC;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:.55rem .6rem .55rem 1rem;display:flex;align-items:center;gap:.75rem;box-shadow:0 14px 34px rgba(18,8,32,.35)}
.dock-t{flex:1;min-width:0;display:grid;justify-items:start;justify-content:stretch;text-align:left;background:none;border:0;color:inherit;padding:.1rem .2rem;min-height:0;border-radius:10px;font-weight:400;gap:0}
.dock-t:hover{background:none;border:0}
.dock-t b{font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-t span{font-size:.82rem;color:#CFC4E2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-clock{font:700 1.1rem var(--display);font-variant-numeric:tabular-nums}
.dock-b{width:42px;height:42px;min-height:0;padding:0;border-radius:50%;background:rgba(255,255,255,.13);border:0;color:#FFFFFF;flex:none}
.dock-b:hover{background:rgba(255,255,255,.24);border:0}
.eqi{display:flex;align-items:flex-end;gap:3px;height:18px;flex:none}
.eqi i{width:4px;height:6px;border-radius:2px;background:#FFC35E}
.eqi.go i{animation:eq .5s ease-in-out infinite alternate}
.eqi.go i:nth-child(2){animation-delay:.15s}
.eqi.go i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:4px}to{height:18px}}
@media (max-width:900px){.dock{left:0;bottom:calc(3.7rem + env(safe-area-inset-bottom,0px));padding:0 .6rem .5rem}}

.gbtn{gap:.6rem}
.gbtn svg{flex:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 1rem);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.65rem 1.1rem;border-radius:999px;font-weight:800;font-size:.95rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 2rem);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function chordTokens(str){return String(str||'').split(/[\s,|;\u2013\u2014-]+/).map(s=>s.replace(/[()]/g,'').trim()).filter(s=>s&&CH_RE.test(s));}
function transpose(c,n){return{root:((c.root+n)%12+12)%12,suf:c.suf,bass:c.bass==null?null:((c.bass+n)%12+12)%12};}

 if(strict)return null;if(c.suf in SIMPLE){const k2=NAMES[c.root]+SIMPLE[c.suf];if(lib[k2])return{name:k2,fr:lib[k2],simple:true};
  const k3=NAMES[c.root]+(SIMPLE[c.suf].startsWith('m')?'m':'');if(lib[k3])return{name:k3,fr:lib[k3],simple:true};}

const TONES={'':[0,4,7],m:[0,3,7],7:[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],sus2:[0,2,7],sus4:[0,5,7],'7sus4':[0,5,7,10],add9:[0,2,4,7],madd9:[0,2,3,7],5:[0,7],6:[0,4,7,9],m6:[0,3,7,9],9:[0,2,4,7,10],maj9:[0,2,4,7,11],m9:[0,2,3,7,10],dim:[0,3,6],dim7:[0,3,6,9],aug:[0,4,8],m7b5:[0,3,6,10]};

 if(L){v=L.fr.map((f,i)=>f<0?null:open[i]+f);}
 else{const iv=TONES[c.suf]||TONES[''];const pcs=iv.map(x=>(c.root+x)%12);
  v=open.map(o=>{for(let f=0;f<=5;f++){if(pcs.includes((o+f)%12))return o+f;}return null;});
  if(inst==='gtr'){const r=c.bass!=null?c.bass:c.root;let bi=-1;
   for(let i=0;i<3&&bi<0;i++){for(let f=0;f<=5;f++){if((open[i]+f)%12===r){v[i]=open[i]+f;bi=i;break;}}}
   if(bi>0)for(let i=0;i<bi;i++)v[i]=null;}}

let AC=null,MASTER=null;const KS=new Map();const VOICE={};let NOISE=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
 try{AC=new C();}catch(e){return null;}MASTER=AC.createGain();MASTER.gain.value=.85;const comp=AC.createDynamicsCompressor();MASTER.connect(comp);comp.connect(AC.destination);}
 if(AC.state==='suspended')AC.resume();return AC;}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ksBuf(f){const k=Math.round(f*4);if(KS.has(k))return KS.get(k);
 const sr=AC.sampleRate,len=Math.floor(sr*2.2),N=Math.max(2,Math.round(sr/f));
 const b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),ring=new Float32Array(N);let p=0;
 for(let i=0;i<N;i++){p=p*.45+(Math.random()*2-1)*.55;ring[i]=p;}
 let idx=0;const damp=f>500?.992:f>250?.995:.997;
 for(let i=0;i<len;i++){const a=ring[idx],nx=ring[(idx+1)%N];d[i]=a;ring[idx]=damp*.5*(a+nx);idx=(idx+1)%N;}
 KS.set(k,b);return b;}

 if(prev){try{prev.g.gain.setTargetAtTime(0,t,.012);prev.s.stop(t+.1);}catch(e){}}
 s.start(t);if(dur){g.gain.setTargetAtTime(0,t+dur,.02);try{s.stop(t+dur+.25);}catch(e){}}

 const s=AC.createBufferSource();s.buffer=NOISE;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700;bp.Q.value=.7;const g=AC.createGain();g.gain.value=1.1;
 s.connect(bp);bp.connect(g);g.connect(MASTER);s.start(t);muteAll(inst,t);}
function click(t,accent,vol){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=accent?1650:1150;
 g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.05);}
function tone(midi,t,dur,vol){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='triangle';o2.type='sine';
 o.frequency.value=mtof(midi);o2.frequency.value=mtof(midi)*2;const g2=AC.createGain();g2.gain.value=.25;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.3,t+.03);g.gain.setValueAtTime(vol||.3,t+dur-.08);g.gain.linearRampToValueAtTime(0,t+dur);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(MASTER);o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02);}

function droneStart(){if(!ac()){toast('Sound isn’t available in this browser');return;}droneStop(true);const a=AC,t=a.currentTime;const sa=saMidi();
 const out=a.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.2,t+1);const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1300;lp.connect(out);out.connect(MASTER);
 const oscs=[[sa,0,.5],[sa+7,4,.32],[sa+12,-4,.28],[sa-12,3,.3]].map(([m,det,v])=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=det;const g=a.createGain();g.gain.value=v*.22;o.connect(g);g.connect(lp);o.start(t);return o;});

  if(sym==='B'||sym==='b'){if(inst==='uke')idx=sym==='B'?1:0;else{const bi=sounding.length?sounding[0]:0;idx=sym==='B'?bi:(bi===0?2:Math.min(bi+1,3));}}

 return s+'</svg>';}

/* ---------------- runner ---------------- */
class Runner{
 constructor(id,blocksFn,onDone){this.id=id;this.blocksFn=blocksFn;this.onDone=onDone;this.blocks=null;this.i=0;this.left=0;this.run=false;this.elapsed=0;this.t=null;this.msg='';}
 el(){return document.getElementById('r-'+this.id);}
 start(){ac();this.blocks=this.blocksFn();if(!this.blocks.length)return;this.i=0;this.left=this.blocks[0].secs;this.elapsed=0;this.run=true;this.last=Date.now();this.msg='';clearInterval(this.t);this.t=setInterval(()=>this.tick(),250);this.mount();}
 tick(){if(!this.run||!this.blocks)return;const now=Date.now(),dt=(now-this.last)/1000;this.last=now;this.left-=dt;this.elapsed+=dt;if(this.left<=0)this.next();else this.paint();}
 toggle(){if(!this.blocks)return;this.run=!this.run;this.last=Date.now();this.mount();}
 next(){if(!this.blocks)return;chime();this.i++;if(this.i>=this.blocks.length){this.finish();return;}this.left=this.blocks[this.i].secs;this.last=Date.now();this.mount();}
 finish(){if(!this.blocks)return;clearInterval(this.t);this.t=null;const mins=Math.max(1,Math.round(this.elapsed/60));this.blocks=null;this.run=false;this.msg=this.onDone?this.onDone(mins):'';this.mount();}
 paint(){paintDock();const el=this.el();if(!el||!this.blocks)return;const c=el.querySelector('.clock');if(c)c.textContent=fmtTime(this.left);const b=el.querySelector('.now .bar i');if(b)b.style.width=Math.round(100*(1-this.left/this.blocks[this.i].secs))+'%';}
 mount(){paintDock();const el=this.el();if(!el)return;const id=this.id;
  if(!this.blocks){const pv=this.blocksFn();
   el.innerHTML=(this.msg?'<p style="margin:0 0 .5rem"><span class="tag ok">'+esc(this.msg)+'</span></p>':'')+'<ul class="blocks">'+pv.map(b=>'<li><span class="t">'+esc(b.name)+'</span><span class="m">'+durLabel(b.secs)+'</span><span class="d">'+esc(b.text)+'</span></li>').join('')+'</ul><div class="row" style="margin-top:1rem"><button class="btn-main" data-act="run" data-r="'+id+'" data-op="start">Start</button></div>';return;}
  const b=this.blocks[this.i];
  el.innerHTML='<div class="now"><p class="sub">Part '+(this.i+1)+' of '+this.blocks.length+(this.run?'':', paused')+'</p><h3>'+esc(b.name)+'</h3><div class="clock">'+fmtTime(this.left)+'</div><div class="bar"><i style="width:'+Math.round(100*(1-this.left/b.secs))+'%"></i></div><p>'+esc(b.text)+'</p>'+
   (b.act?'<p><button data-act="'+b.act+'" data-i="'+b.i+'">'+esc(b.actText)+'</button></p>':'')+(b.href?'<p><a class="btn" href="'+b.href+'">'+esc(b.hrefText)+'</a></p>':'')+'</div>'+
   '<div class="row" style="margin-top:1rem"><button class="btn-main" data-act="run" data-r="'+id+'" data-op="toggle">'+(this.run?'Pause':'Resume')+'</button><button data-act="run" data-r="'+id+'" data-op="next">'+(this.i===this.blocks.length-1?'Finish':'Next part')+'</button><button class="btn-quiet" data-act="run" data-r="'+id+'" data-op="end">End now</button></div>'+
   '<ul class="blocks">'+this.blocks.map((x,j)=>'<li class="'+(j<this.i?'past':j===this.i?'cur':'')+'"><span class="t">'+esc(x.name)+'</span><span class="m">'+durLabel(x.secs)+'</span></li>').join('')+'</ul>';}
}

const KH={text:'',shift:0};
function keyChords(){const toks=chordTokens(KH.text);const moved=toks.map(t=>{const c=parseChord(t);return c?transpose(c,KH.shift):null;}).filter(Boolean);
 const uniq=[];moved.forEach(c=>{if(!uniq.some(u=>cname(u)===cname(c)))uniq.push(c);});return{moved:moved,uniq:uniq};}
function capoOptions(uniq,inst){const opts=[];for(let cp=0;cp<=7;cp++){const shapes=uniq.map(c=>transpose(c,-cp));opts.push({cp:cp,shapes:shapes,easy:shapes.filter(c=>lookup(inst,c,true)).length});}
 return opts.sort((a,b)=>b.easy-a.easy||a.cp-b.cp).slice(0,3);}
function paintKey(){const out=$('#k-out');if(!out)return;const kc=keyChords(),sh=KH.shift;
 if(!kc.uniq.length){out.innerHTML='<p class="note" style="margin-top:.75rem">Try typing C#m A F#m B, a progression full of awkward shapes, and see what a capo does.</p>';return;}
 const inst=S.prefs.kinst;
 let h='<h4>Move the key to suit your voice</h4><div class="row"><button data-act="k-shift" data-v="-1" aria-label="Down one semitone">−1</button><span style="min-width:9rem;text-align:center;font-weight:800">'+(sh===0?'Original key':(sh>0?'Up ':'Down ')+Math.abs(sh)+' semitone'+(Math.abs(sh)>1?'s':''))+'</span><button data-act="k-shift" data-v="1" aria-label="Up one semitone">+1</button></div><p style="margin-top:.6rem"><b>'+kc.moved.map(c=>esc(cname(c))).join(' ')+'</b></p><p class="note">Change one semitone at a time and sing the highest line of the chorus each time. Stop at the first key that feels easy.</p>';
 h+='<h4>Easiest capo positions on '+INST_NAME[inst].toLowerCase()+'</h4><div class="capo-opts">'+capoOptions(kc.uniq,inst).map(o=>'<div class="capo-opt"><div><b>'+(o.cp?'Capo on fret '+o.cp:'No capo')+'</b><p class="sub">Play '+o.shapes.map(c=>esc(cname(c))).join(' ')+'</p></div><div class="row"><span class="tag'+(o.easy===kc.uniq.length?' ok':'')+'">'+o.easy+' of '+kc.uniq.length+' shapes in the library</span><button data-act="k-practise" data-cp="'+o.cp+'">Practise</button></div></div>').join('')+'</div>';
 out.innerHTML=h;}

 else{h+='<section class="panel" style="max-width:820px"><h2>Key and capo helper</h2><p class="sub">Paste the chords from a chord sheet. Move the song to suit your voice, then find the easiest shapes with a capo.</p><div class="fields"><div><label class="f" for="k-text">Chords from the sheet</label><input type="text" id="k-text" data-in="k-text" value="'+esc(KH.text)+'" placeholder="C#m A F#m B" autocomplete="off"></div><div><span class="f">Instrument</span>'+instSeg('k-inst',S.prefs.kinst)+'</div></div><div id="k-out"></div></section>';}
 $('#v-tools').innerHTML=h;updatePlayerInfo();paintKey();}
function updatePlayerInfo(){const p=pp();const toks=chordTokens(p.text);const cs=toks.map(parseChord).filter(Boolean);const w=$('#p-warn');

 if(w)w.textContent=(!cs.length&&p.text.trim())?'No chords recognised. Use names like C, Am, F#m or G7.':missing.length?'No diagram yet for '+missing.join(', ')+'. It will still play; the capo helper can find easier shapes.':'';

 for(let i=0;i<84;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dayKey(d),m=S.log[k]||0,fut=d>now;
  h+='<i class="'+(fut?'fut':m>=30?'l3':m>=15?'l2':m>0?'l1':'')+'" title="'+k+(fut?'':', '+m+' min')+'"></i>';}
 return h;}

 const eq=on=>'<span class="eqi'+(on?' go':'')+'" aria-hidden="true"><i></i><i></i><i></i></span>';

 else if(P.playing){const p=pp();k='play|'+p.text+'|'+p.bpm+'|'+p.pat;h='<div class="dock-in">'+eq(true)+'<button class="dock-t" data-act="dock-open" data-v="tools"><b>Strum trainer</b><span>'+esc(chordTokens(p.text).join(' '))+', '+p.bpm+' bpm</span></button><button class="dock-b" data-act="p-play" aria-label="Stop the strum trainer">'+ICON.stop+'</button></div>';}
 else if(DRONE){k='drone|'+saMidi();h='<div class="dock-in">'+eq(true)+'<button class="dock-t" data-act="dock-open" data-v="singing"><b>Sa drone</b><span>Home note '+noteName(saMidi())+'</span></button><button class="dock-b" data-act="drone" aria-label="Stop the drone">'+ICON.stop+'</button></div>';}
 if(k!==DOCK_KEY){DOCK_KEY=k;el.innerHTML=h;el.hidden=!h;document.body.classList.toggle('has-dock',!!h);}

function route(){const hasAuth=typeof AUTH!=='undefined';const locked=hasAuth&&!AUTH.user&&!AUTH.guest;document.body.classList.toggle('locked',locked);if(hasAuth)renderAcct();
 if(locked){if(curView){const old=document.getElementById('v-'+curView);if(old)old.innerHTML='';}if(P.playing)playerStop();if(DRONE)droneStop();curView=null;
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-signin'));renderSignin();return;}
 const si=document.getElementById('v-signin');if(si)si.innerHTML='';
 const v=WANT||hashView()||'today';const changed=curView!==v;
 if(changed&&curView){const old=document.getElementById('v-'+curView);if(old)old.innerHTML='';}
 curView=v;
 $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
 $$('nav.tabs a').forEach(a=>{if(a.dataset.view===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 RENDER[v]();paintDock();
 if(PENDING_SCROLL){const el=document.getElementById(PENDING_SCROLL);PENDING_SCROLL=null;if(el)el.scrollIntoView({block:'start'});}

 'k-shift':d=>{KH.shift=Math.max(-11,Math.min(11,KH.shift+(+d.v)));paintKey();focusSel('[data-act="k-shift"][data-v="'+d.v+'"]');},
 'k-practise':d=>{const cp=+d.cp;const kc=keyChords();if(!kc.moved.length)return;if(P.playing)playerStop();
  Object.assign(pp(),{text:kc.moved.map(c=>cname(transpose(c,-cp))).join(' '),inst:S.prefs.kinst});save();
  SUB.tools='trainer';renderTools();const el=document.getElementById('trainer');if(el)el.scrollIntoView({block:'start'});if(cp)toast('Put your capo on fret '+cp);},
 'tune':d=>playString(d.inst,+d.i),
 'drone':()=>{if(DRONE)droneStop();else droneStart();const b=$('#drone-btn');if(b)b.textContent=DRONE?'Stop drone':'Start drone';},
 'scale':()=>playScale(),
 'reg':d=>{S.prefs.reg=d.v;save();if(DRONE)droneStart();rerender();focusSel('[data-act="reg"][data-v="'+d.v+'"]');},
 'range-mode':d=>{RMODE=d.v;rerender();focusSel('[data-act="range-mode"][data-v="'+d.v+'"]');},
 'range-note':d=>{const m=+d.m;if(ac())tone(m,AC.currentTime+.03,1.2,.3);
  if(RMODE==='lo'){S.sing.lo=m;if(S.sing.hi!=null&&S.sing.hi<=m)S.sing.hi=null;RMODE='hi';}
  else{S.sing.hi=m;if(S.sing.lo!=null&&S.sing.lo>=m)S.sing.lo=null;}
  const pw=$('#v-singing .piano-wrap'),sl=pw?pw.scrollLeft:0;save();rerender();const pw2=$('#v-singing .piano-wrap');if(pw2)pw2.scrollLeft=sl;focusSel('[data-act="range-note"][data-m="'+m+'"]');},
 'log-add':()=>{const d=$('#l-d').value,mi=$('#l-m'),m=Math.round(+mi.value),err=$('#l-err');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){err.textContent='Choose a date.';err.hidden=false;return;}
  if(d>dayKey()){err.textContent='Choose today or an earlier day.';err.hidden=false;return;}
  if(!(m>=1&&m<=600)){err.textContent='Enter minutes between 1 and 600.';err.hidden=false;mi.focus();return;}
  S.log[d]=(S.log[d]||0)+m;save();toast('Logged '+m+' min');rerender();},
 'reset':()=>{const b=$('#reset-btn');if(!resetArm){if(b)b.textContent='Tap again to reset everything';resetArm=setTimeout(()=>{resetArm=null;const x=$('#reset-btn');if(x)x.textContent='Reset all progress';},4000);return;}
  clearTimeout(resetArm);resetArm=null;S=blankState();OPEN_ST.clear();openInit=false;OPEN_DET.clear();save();toast('Progress reset');rerender();}
};
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const v=a.getAttribute('href').slice(1);if(VIEWS.indexOf(v)>=0){e.preventDefault();go(v);return;}}
 const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b);});
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset&&t.dataset.act&&t.tagName.toLowerCase()==='g'){e.preventDefault();const f=ACT[t.dataset.act];if(f)f(t.dataset,t);}});
function setChk(key,v){const p=key.split('|');
 if(p[0]==='ms')S.ms[p[1]]=v;else if(p[0]==='wk')S.wk[p[1]]=v;else if(p[0]==='lv')S.sing.lv[+p[1]]=v;else if(p[0]==='cf')S.sing.cf[+p[1]]=v;
 else if(p[0]==='step'){const s=S.songs.find(x=>x.id===p[1]);if(s)s.steps[+p[2]]=v;}
 if(p[0]==='ms'&&v){const i=+p[1].split('-')[0];if(stageDone(i))toast(i<6?'Stage '+(i+1)+' complete. On to stage '+(i+2)+'.':'You’ve finished the whole roadmap.');}}
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.chk){const key=t.dataset.chk;setChk(key,t.checked);save();rerender();focusSel('[data-chk="'+key.replace(/"/g,'\\"')+'"]');return;}
 if(t.dataset.in&&(t.tagName==='SELECT'||t.type==='checkbox'))onInput(t);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in&&t.type!=='checkbox'&&t.tagName!=='SELECT')onInput(t);});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.det){if(d.open)OPEN_DET.add(d.dataset.det);else OPEN_DET.delete(d.dataset.det);}},true);
function onInput(t){const k=t.dataset.in,p=pp();
 if(k.indexOf('clr-')===0){const e=document.getElementById(k.slice(4)+'-err');if(e)e.hidden=true;return;}
 if(k==='song-ch'||k==='song-key'){const s=S.songs.find(x=>x.id===t.dataset.id);if(s){s[k==='song-ch'?'ch':'key']=t.value;saveSoon();}return;}
 if(k==='p-text'){p.text=t.value;saveSoon();if(P.playing){const cs=chordTokens(p.text).map(parseChord).filter(Boolean);if(cs.length)P.chords=cs;}updatePlayerInfo();return;}
 if(k==='p-pat'){p.pat=t.value;saveSoon();const sl=$('#p-slots');if(sl)sl.innerHTML=slotsHTML(p.pat);return;}
 if(k==='p-bpm'){p.bpm=Math.round(+t.value);const o=$('#p-bpm-o');if(o)o.textContent=p.bpm;saveSoon();return;}
 if(k==='p-click'){p.click=t.checked;saveSoon();return;}
 if(k==='p-count'){p.countIn=t.checked;saveSoon();return;}
 if(k==='k-text'){KH.text=t.value;paintKey();return;}
 if(k==='s-key'){S.prefs.key=+t.value;save();if(DRONE)droneStart();rerender();focusSel('#s-key');return;}}

/* ---------------- Google sign-in and Firestore sync ---------------- */
const CFG=window.FIREBASE_CONFIG||{};
const AUTH={user:null,guest:false,configured:!!(CFG.apiKey&&!/^PASTE/.test(CFG.apiKey)),status:'loading',signIn:null,signOut:null};
if(!AUTH.configured)AUTH.status='unconfigured';
const CLIENT=Math.random().toString(36).slice(2)+Date.now().toString(36);
const SYNC={push:null,ready:false,pending:false,busy:false,adopted:false,t:null};
function setSync(state){const T={local:'Saved on this device only',loading:'Loading your progress…',synced:'Saved to your Google account',saving:'Saving…',error:'Couldn’t reach your account. Progress is kept on this device and will sync when you’re back online.',denied:'Your account couldn’t save. Check that the Firestore database exists and its rules are published (see the setup notes at the top of the file).'};
 const m=$('#syncmsg'),d=$('#syncdot');if(m)m.textContent=T[state]||T.local;if(d)d.classList.toggle('ok',state==='synced');}
function queueRemote(now){if(!SYNC.push||!SYNC.ready){SYNC.pending=true;return;}clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>SYNC.push(),now?0:1200);}
function switchLocal(id){const fromGuest=LS_KEY===LS_BASE+':guest';const guestState=S;LS_KEY=LS_BASE+':'+id;let next=loadLocal();SYNC.adopted=false;
 if(id!=='guest'&&fromGuest&&!next.updatedAt&&guestState.updatedAt){next=guestState;SYNC.adopted=true;
  try{localStorage.setItem(LS_KEY,JSON.stringify(next));localStorage.removeItem(LS_BASE+':guest');}catch(e){}}
 S=next;OPEN_ST.clear();openInit=false;OPEN_DET.clear();}
function applyRemote(r){S=migrate(r);try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}OPEN_ST.clear();openInit=false;rerender();}
function authError(e){const c=(e&&e.code)||'';const M={'auth/unauthorized-domain':'This web address isn’t on your Firebase project’s authorized domains. Add it under Authentication, then Settings, then Authorized domains.',
 'auth/operation-not-allowed':'Google sign-in isn’t switched on for this Firebase project yet. Turn it on under Authentication, then Sign-in method.',
 'auth/network-request-failed':'Couldn’t reach Google. Check your connection and try again.',
 'auth/popup-blocked':'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.'};
 const msg=M[c]||('Sign-in didn’t work ('+(c||'unknown error')+'). Try again.');const el=$('#auth-err');if(el){el.textContent=msg;el.hidden=false;}else toast(msg);}
const GLOGO='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>';
function renderSignin(){const st=AUTH.status;
 let h='<div class="stagecard"><p class="kicker">Ukulele to guitar, Tamil and English songs, with singing</p><h1>Four strings to six</h1><p class="lede">Sign in with Google to keep your sessions, songs and milestones in sync across your phone and computer.</p><div class="neck"><div class="neck-top"><span>Ukulele, four strings</span><span>Guitar, six strings</span></div>'+neckSVG(-1,true)+'</div>';
 if(st==='unconfigured')h+='<div class="panel" style="margin-top:1.5rem"><h3>Finish the Firebase setup</h3><p>Paste your Firebase web app config into the <code>FIREBASE_CONFIG</code> block near the top of <code>index.html</code>. The setup notes at the top of the file walk you through it in about fifteen minutes. Until then you can use the app on this device.</p></div>';
 if(st==='failed')h+='<p class="warn" style="margin-top:1.25rem">Couldn’t load Google sign-in. Check your connection and reload, or use the app on this device for now.</p>';
 h+='<div class="row" style="margin-top:1.5rem">'+(st==='signedout'?'<button class="gbtn big" data-act="signin">'+GLOGO+'Continue with Google</button>':'')+(st==='loading'?'<span class="note">Checking whether you’re signed in…</span>':'')+'<button class="btn-quiet" data-act="guest">Use on this device only</button></div><p class="warn" id="auth-err" hidden></p>';
 h+='<p class="note" style="margin-top:1rem">Only you can read or change your progress. If your account has no saved progress yet, anything you tracked on this device moves into it when you sign in.</p></div>';
 $('#v-signin').innerHTML=h;}
function renderAcct(){const el=$('#acct');if(!el)return;const u=AUTH.user;
 if(u){const first=((u.name||u.email||'').split(/[\s@]/)[0])||'You';
  el.innerHTML=(u.photo?'<img src="'+esc(u.photo)+'" alt="" referrerpolicy="no-referrer">':'<span class="avatar" aria-hidden="true">'+esc(first.charAt(0).toUpperCase())+'</span>')+'<span class="acct-name">'+esc(first)+'</span><button class="btn-quiet" data-act="signout">Sign out</button>';}
 else if(AUTH.guest&&AUTH.status==='signedout')el.innerHTML='<button class="gbtn" data-act="signin">'+GLOGO+'Sign in</button>';
 else el.innerHTML='';}

route();
setTimeout(()=>{if(AUTH.status==='loading'){AUTH.status='failed';if(!AUTH.user&&!AUTH.guest)route();else renderAcct();}},10000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

if (AUTH.configured) {
  const app = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  getRedirectResult(auth).catch(authError);

  AUTH.signIn = async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-environment') {
        try { await signInWithRedirect(auth, provider); } catch (e2) { authError(e2); }
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { authError(e); }
    }
  };
  AUTH.signOut = () => signOut(auth).catch(() => toast('Couldn’t sign out. Try again.'));

  let unsub = null;
  onAuthStateChanged(auth, (user) => {
    if (unsub) { unsub(); unsub = null; }
    SYNC.push = null; SYNC.ready = false; SYNC.pending = false; clearTimeout(SYNC.t);

    if (!user) {
      const wasUser = !!AUTH.user;
      AUTH.user = null; AUTH.status = 'signedout';
      if (wasUser) { AUTH.guest = false; switchLocal('guest'); toast('Signed out'); }
      setSync('local'); route();
      return;
    }

    AUTH.user = { uid: user.uid, name: user.displayName || '', email: user.email || '', photo: user.photoURL || '' };
    AUTH.guest = false; AUTH.status = 'signedin';
    switchLocal(user.uid);
    setSync('loading'); route();

    const ref = doc(db, 'users', user.uid);
    SYNC.push = async () => {
      if (SYNC.busy) { SYNC.pending = true; return; }
      SYNC.busy = true; SYNC.pending = false; setSync('saving');
      try {
        await setDoc(ref, { state: JSON.stringify(S), updatedAt: S.updatedAt || Date.now(), client: CLIENT });
        setSync('synced');
      } catch (e) {
        setSync(e && e.code === 'permission-denied' ? 'denied' : 'error');
        if (!(e && e.code === 'permission-denied')) setTimeout(() => queueRemote(true), 5000);
      }
      SYNC.busy = false;
      if (SYNC.pending) queueRemote(false);
    };

    let first = true;
    unsub = onSnapshot(ref, (snap) => {
      const d = snap.exists() ? snap.data() : null;
      const ru = d ? (d.updatedAt || 0) : 0, lu = S.updatedAt || 0;
      const parse = () => { try { return JSON.parse(d.state); } catch (e) { return null; } };
      if (first) {
        first = false; SYNC.ready = true;
        if (d && (SYNC.adopted || ru > lu)) { const r = parse(); if (r) applyRemote(r); SYNC.pending = false; setSync('synced'); if (SYNC.adopted) toast('Loaded the progress saved in your account'); }
        else if (!d || lu > ru) { if (S.updatedAt) queueRemote(true); else setSync('synced'); }
        else { setSync('synced'); if (SYNC.pending) queueRemote(false); }
        SYNC.adopted = false;
        return;
      }
      if (snap.metadata.hasPendingWrites || !d) return;
      if (d.client !== CLIENT && ru > lu) { const r = parse(); if (r) { applyRemote(r); toast('Updated from your other device'); } }
    }, (e) => { setSync(e && e.code === 'permission-denied' ? 'denied' : 'error'); });
  });
}
</script>
