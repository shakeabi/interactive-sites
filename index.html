<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Interview Board &mdash; hard track</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap');

.osg * { box-sizing: border-box; }
.osg {
  --ink:#070B1A; --panel:#0E1530; --edge:#1E2A55; --edge2:#2E3D70;
  --bios:#2B3FC4; --phos:#9FB6EE; --dim:#5E729F; --sand:#F2E7CE;
  --alert:#FF6B45; --teal:#58C6B4;
  background:var(--ink); color:var(--phos);
  font-family:'IBM Plex Mono', ui-monospace, monospace;
  min-height:100vh; display:flex; flex-direction:column;
  font-size:14px; line-height:1.55;
}
.osg ::selection { background:var(--bios); color:var(--sand); }

.bar {
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border-bottom:1px solid var(--edge); padding:9px 16px;
  background:var(--panel); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
}
.bar b { color:var(--sand); font-weight:600; letter-spacing:.2em; }
.bar .sep { color:var(--edge2); }
.bar .right { margin-left:auto; color:var(--dim); }

.body { display:flex; flex:1; align-items:stretch; }

.rail {
  width:270px; flex:0 0 270px; border-right:1px solid var(--edge);
  padding:18px 0 40px; background:linear-gradient(180deg,var(--panel),var(--ink) 60%);
}
.rail h2 {
  font-size:10px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase;
  margin:0 0 12px; padding:0 16px; font-weight:500;
}
.item {
  display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
  color:var(--phos); font:inherit; padding:7px 16px 7px 12px; line-height:1.35;
}
.item:hover { color:var(--sand); }
.item.on { background:var(--bios); color:#fff; }
.item.on .idx { color:#C9D6FF; }
.item .idx { color:var(--dim); }
.item .nm { display:block; padding-left:22px; font-size:12.5px; }
.item .mt { display:block; padding-left:22px; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--dim); margin-top:2px; }
.item.on .mt { color:#AEBEFF; }

.main { flex:1; min-width:0; padding:30px 34px 90px; max-width:920px; }

.eyebrow { font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--alert); }
.h1 { font-family:'Newsreader',serif; font-size:34px; line-height:1.12; color:var(--sand);
  margin:8px 0 6px; font-weight:500; letter-spacing:-.01em; }
.blurb { color:var(--dim); font-size:12.5px; max-width:62ch; margin-bottom:22px; }

.meter { display:flex; gap:4px; margin:0 0 26px; }
.tick { height:5px; flex:1; background:var(--edge); }
.tick.done { background:var(--bios); }
.tick.now { background:var(--alert); }

.stage { border-left:2px solid var(--edge2); padding:0 0 30px 20px; margin-bottom:4px; position:relative; }
.stage.live { border-left-color:var(--alert); }
.stage .sn {
  position:absolute; left:-2px; top:2px; width:2px; height:16px; background:var(--sand);
}
.slab { font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
.stage.live .slab { color:var(--sand); }
.st { font-family:'Newsreader',serif; font-size:20px; color:var(--sand); margin:3px 0 10px; font-weight:500; }
.setup { font-family:'Newsreader',serif; font-size:16.5px; line-height:1.62; color:#D6E0F7; max-width:68ch; }
.setup code { font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--teal); }

.ask { margin:14px 0 0; padding:12px 14px; background:rgba(43,63,196,.16);
  border-left:2px solid var(--bios); color:var(--sand); font-size:13.5px; max-width:68ch; }
.ask::before { content:"ASK  "; color:var(--dim); font-size:10px; letter-spacing:.2em; }

.tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.tag { font-size:10px; letter-spacing:.08em; color:var(--teal); border:1px solid rgba(88,198,180,.3);
  padding:2px 7px; text-transform:uppercase; }

.acts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.btn { font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  background:none; border:1px solid var(--edge2); color:var(--phos); padding:6px 12px; cursor:pointer; }
.btn:hover { border-color:var(--sand); color:var(--sand); }
.btn.on { background:var(--edge); color:var(--sand); border-color:var(--edge2); }
.btn.go { border-color:var(--alert); color:var(--alert); }
.btn.go:hover { background:var(--alert); color:var(--ink); }
.btn:focus-visible, .item:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
.k { color:var(--dim); }

.panelbox { margin-top:12px; border:1px solid var(--edge); background:var(--panel); max-width:72ch; }
.panelbox .ph { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
  padding:8px 14px; border-bottom:1px solid var(--edge); }
.panelbox .pb { padding:12px 14px; font-size:13px; color:#C6D3F0; }
.grade { display:grid; grid-template-columns:82px 1fr; gap:6px 14px; padding:12px 14px; font-size:12.5px; }
.grade dt { font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding-top:3px; }
.g1 { color:var(--alert); } .g2 { color:var(--phos); } .g3 { color:var(--teal); }
.grade dd { margin:0; color:#C6D3F0; }

.locked { color:var(--dim); font-size:12.5px; padding:16px 0 0; }
.foot { margin-top:34px; padding-top:18px; border-top:1px solid var(--edge); color:var(--dim); font-size:12px; max-width:68ch; }

.hotbar { position:sticky; bottom:0; display:flex; gap:18px; flex-wrap:wrap;
  border-top:1px solid var(--edge); background:var(--panel); padding:8px 16px;
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
.hotbar kbd { font:inherit; color:var(--sand); background:var(--edge); padding:1px 5px; margin-right:5px; }

.ansbox { border-left:2px solid var(--teal); }
.ansbox .ph { color:var(--teal); }
.crux { color:var(--sand); font-family:'Newsreader',serif; font-size:16px; line-height:1.5;
  padding:12px 14px; border-bottom:1px solid var(--edge); }
.ansbody { padding:12px 14px; }
.ansbody p { margin:0 0 11px; font-size:13px; color:#C6D3F0; }
.ansbody p:last-child { margin-bottom:0; }
.code { margin:0 0 12px; padding:11px 13px; background:#060A18; border:1px solid var(--edge);
  overflow-x:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6;
  color:var(--teal); white-space:pre; }

.reveal { animation:fade .22s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) { .reveal { animation:none; } }

@media (max-width:860px) {
  .body { flex-direction:column; }
  .rail { width:100%; flex:none; border-right:0; border-bottom:1px solid var(--edge);
    display:flex; overflow-x:auto; padding:10px; gap:6px; }
  .rail h2 { display:none; }
  .item { width:auto; flex:0 0 auto; border:1px solid var(--edge); padding:6px 10px; }
  .item .nm, .item .mt { display:none; }
  .item .idx::after { content:attr(data-t); color:inherit; margin-left:8px; }
  .main { padding:22px 16px 70px; }
  .h1 { font-size:26px; }
  .setup { font-size:15.5px; }
}
/* ---- html build: full DOM, class-toggled ---- */
.prob { display:none; }
.prob.on { display:block; }
.hid { display:none; }
.expander { margin-left:auto; display:flex; gap:8px; }
.tbtn { font:inherit; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  background:none; border:1px solid var(--edge2); color:var(--dim); padding:4px 9px; cursor:pointer; }
.tbtn:hover { color:var(--sand); border-color:var(--sand); }
.tbtn.on { background:var(--bios); color:#fff; border-color:var(--bios); }
.bar .right { margin-left:0; }

@media print {
  @page { margin:16mm 14mm; }
  .osg { background:#fff; color:#111; display:block; min-height:0; font-size:10.5pt; }
  .bar, .rail, .hotbar, .acts, .meter, .expander { display:none !important; }
  .body { display:block; }
  .main { max-width:none; padding:0; }
  .prob { display:block !important; page-break-before:always; }
  .prob:first-child { page-break-before:avoid; }
  .hid { display:block !important; }
  .stage, .panelbox, .code { break-inside:avoid; }
  .h1 { font-size:22pt; color:#000; }
  .st { font-size:14pt; color:#000; }
  .crux { color:#000; border-bottom:1px solid #ccc; }
  .eyebrow { color:#000; }
  .slab { color:#666; }
  .blurb, .setup, .ansbody p, .grade dd, .panelbox .pb { color:#1a1a1a; }
  .ask { background:#eee; color:#000; border-left:2px solid #000; }
  .code { background:#f5f5f5; color:#111; border:1px solid #ccc; font-size:9pt; }
  .tag { color:#555; border-color:#ccc; }
  .stage { border-left-color:#ccc; }
  .stage.live { border-left-color:#999; }
  .panelbox, .ansbox { border:1px solid #ccc; background:#fff; }
  .panelbox .ph { color:#555; border-bottom-color:#ddd; }
  .g1, .g2, .g3 { color:#000; }
  .foot { color:#555; border-top-color:#ccc; }
}

</style>
</head>
<body>
<div class="osg">

  <div class="bar">
    <b>OS Interview Board</b>
    <span class="sep">&#9474;</span>
    <span>6 problems &middot; 32 escalations</span>
    <span class="sep">&#9474;</span>
    <span id="count">1/32 revealed</span>
    <span class="expander">
      <button class="tbtn" id="exp">Expand all</button>
      <button class="tbtn" id="print">Print answer key</button>
    </span>
  </div>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Problems"></nav>
    <main class="main" id="main"></main>
  </div>

  <div class="hotbar">
    <span><kbd>1-6</kbd>problem</span>
    <span><kbd>&#8593;&#8595;</kbd>switch</span>
    <span><kbd>&#8629;</kbd>next twist</span>
    <span><kbd>H</kbd>nudge</span>
    <span><kbd>R</kbd>grading signal</span>
    <span><kbd>A</kbd>model answer</span>
  </div>

</div>
<script>
const P = [
  {
    key: "logger",
    name: "The logger that ate the server",
    meta: "concurrency · I/O · memory model",
    blurb:
      "One innocent logging call, followed all the way down from the mutex to the cache line. Start here — it rewards candidates who never stop asking what happens one layer lower.",
    stages: [
      {
        t: "Throughput goes backwards",
        setup:
          "A request-handling service runs a pool of 32 worker threads. Every request calls log(), which takes one global mutex and does an fprintf to a shared FILE*. With 4 workers the service handles 40k req/s. With 32 workers it handles 22k req/s, and top shows most of the CPU time is in the kernel rather than in the application.",
        ask: "Why does adding workers make it slower, and where exactly is that kernel time going?",
        hint:
          "Nothing here is unbounded work — the total work per request is identical in both runs. So the loss must be in coordination, not computation. What does an uncontended mutex cost, and what does a contended one cost?",
        tags: ["mutex contention", "futex", "convoy effect", "Amdahl"],
        weak: "Says 'too many threads, context switching' and stops. No mechanism.",
        solid:
          "Identifies the serial section: the critical section is a fixed cost per request, so throughput is capped by 1/(critical section time) no matter how many threads exist. Notes that an uncontended pthread mutex is a userspace atomic CAS, but under contention it becomes futex_wait/futex_wake syscalls plus sleeps and wakeups — that's the sys time. More waiters means more wakeups per unlock.",
        strong:
          "Adds the convoy effect: the woken thread is cache-cold and gets descheduled, so contention makes it worse than a purely serial run. Points out the FILE* already has its own internal lock, so there are two layers of serialization. Names how to confirm it rather than guess: off-CPU profiling, perf lock contention, or just measuring critical-section duration. Suggests sharding or removing the shared resource rather than tuning the lock.",
      },
      {
        t: "Two kinds of missing data",
        setup:
          "They switch to per-thread buffers, drained by a background thread every 200ms with a single write() call. Throughput recovers. Then two incidents: after a kill -9, the last few log lines are missing. After a datacenter power loss, several full seconds of logs are gone — including lines the application had already successfully written and gotten a return value for.",
        ask: "Explain why those two failures lose different amounts of data. What does a successful write() actually promise?",
        hint: "Count the buffers between the application's log() call and a magnetic or flash surface. There are more than two.",
        tags: ["page cache", "fsync", "durability", "write barriers"],
        weak: "Treats write() as 'saved to disk' and can't explain the difference between the two crashes.",
        solid:
          "Lays out the layers: userspace buffer (lost only when the process dies), kernel page cache (survives process death, lost on power loss), then the device. write() promises only that the kernel took ownership of the bytes. Durability needs fsync/fdatasync.",
        strong:
          "Distinguishes fdatasync from fsync (skips metadata that isn't needed to read the data back — mtime yes, a size change no). Goes one layer further to the drive's own volatile write cache and the need for a cache-flush or FUA to survive power loss. Mentions that on Linux a failed writeback may surface as EIO exactly once and then be cleared, so ignoring an fsync return value is a data-loss bug — and that retrying fsync after a failure does not re-attempt the lost pages.",
      },
      {
        t: "One thread's fsync, everyone's latency",
        setup:
          "They add fdatasync() after every flush. Median latency is unchanged. p99.9 jumps to 400ms, and — the part that confuses them — requests that do no logging at all also slow down, as do unrelated processes writing to different files on the same filesystem.",
        ask: "Why does one thread's fsync degrade work it has nothing to do with? How would you get durability without this?",
        hint: "The journal is a filesystem-wide object, not a per-file one.",
        tags: ["journaling", "ext4 ordered mode", "group commit", "tail latency"],
        weak: "'fsync is slow because disks are slow.' Doesn't explain the blast radius beyond the calling thread.",
        solid:
          "Explains that fsync forces a journal transaction commit, and in ext4's default ordered mode all dirty data belonging to the running transaction must be written out first — including other files' data. So an unrelated writer's dirty pages get dragged into your latency. Plus the blocked worker removes capacity from a fixed-size pool, which pushes queueing delay onto everything else.",
        strong:
          "Names it as fsync entanglement and proposes amortization: batch N records per fsync and acknowledge in groups (group commit, exactly what databases do), so the durability cost is per-batch not per-record. Alternatives: put the log on its own filesystem or device to shrink the blast radius, use O_DSYNC on a preallocated extent to avoid metadata updates, or decide the log doesn't need synchronous durability at all and instead bound the loss window. Bonus if they reason about which of these actually changes the guarantee versus just moving the cost.",
      },
      {
        t: "It works on my laptop, it corrupts on the server",
        setup:
          "The team replaces the mutex with a lock-free multi-producer ring buffer. It passes every test on their x86 laptops, including ThreadSanitizer runs. In production on ARM servers, roughly once an hour the consumer reads a record whose header claims 40 bytes but whose body is half old data and half new.",
        ask: "What is happening, and why did x86 hide it?",
        hint: "The producer does two things: fill the slot, then publish the index. Who guarantees the order in which other cores observe those two things?",
        tags: ["memory ordering", "acquire/release", "TSO vs weak", "compiler barriers"],
        weak: "'ARM is buggy' or 'add volatile'. volatile prevents compiler caching of the value; it says nothing about inter-core visibility.",
        solid:
          "Identifies missing release/acquire pairing. The producer's payload stores must be ordered before the store that publishes the slot, and the consumer's load of the index must be ordered before it reads the payload. x86's TSO already forbids store-store reordering, so the bug is invisible there; ARM is weakly ordered and will reorder freely.",
        strong:
          "Notes that even on x86 the compiler alone can sink or hoist the stores, so this was always UB, not merely an ARM problem. Specifies the actual fix: store-release on publish, load-acquire on consume, which costs a dmb ish on ARM and is free on x86 — and that reaching for seq_cst everywhere would work but adds a full barrier per operation. Mentions that TSan can only report what the hardware and instrumentation let it observe, so a green test run on x86 proves very little about a weak memory model.",
      },
      {
        t: "An empty queue that still stalls",
        setup:
          "Ordering is fixed and correctness is solid. But the ring is 99% empty and producers still stall; the consumer core shows an enormous cache miss rate. perf c2c points at a single hot cache line.",
        ask: "Diagnose it, and give the fix and its cost.",
        hint: "Look at how the head index, the tail index, and the 'records dropped' counter are laid out in the struct.",
        tags: ["false sharing", "cache coherence", "MESI", "alignment"],
        weak: "Suggests making the buffer bigger.",
        solid:
          "False sharing: head, tail and the counter share a 64-byte line, so every producer increment invalidates the consumer's copy and vice versa. The line ping-pongs between cores under the coherence protocol even though the threads touch logically independent variables. Fix by padding each to its own cache line.",
        strong:
          "Pads to 128 bytes rather than 64 because of adjacent-line prefetching on several Intel and ARM parts, and knows the portable name for the quantity (hardware destructive interference size). Then goes after the remaining coherence traffic: producers shouldn't read the consumer's tail on every push — cache a snapshot and only re-read when the buffer appears full, which is the Disruptor / DPDK rte_ring trick. Understands this changes a per-operation coherence miss into a per-batch one.",
      },
      {
        t: "The bug that needs 430 seconds to happen",
        setup:
          "The ring uses a 32-bit monotonically increasing sequence number, indexed with sequence % capacity. Production runs at 10M records/sec. It has been stable for weeks. You are asked to sign off on it.",
        ask: "What do you refuse to sign off on, and separately — how does this design free memory safely if slots ever hold pointers?",
        hint: "2^32 divided by 10 million is a number small enough to be a coffee break.",
        tags: ["ABA", "wraparound", "hazard pointers", "RCU", "epoch reclamation"],
        weak: "Says wraparound is fine because modulo handles it.",
        solid:
          "The counter wraps roughly every 430 seconds. Any producer stalled mid-publish longer than that — preempted, migrated, hypervisor-descheduled, stopped in a debugger — resumes holding a sequence number that now aliases a live slot, and silently overwrites valid data. This is ABA: the value it re-checks looks unchanged but the world moved. Fix with 64-bit sequences, which won't wrap in the machine's lifetime.",
        strong:
          "Points out the failure is invisible in testing precisely because it needs a rare long stall coinciding with wrap, and that virtualized environments make multi-hundred-millisecond stalls routine. On reclamation: you can't free memory a lock-free reader might still be traversing, and there's no lock to tell you when it's done — so you need hazard pointers, epoch-based reclamation, or RCU-style grace periods. Connects RCU back to the kernel: readers are essentially free, writers pay for deferred destruction.",
      },
    ],
  },
  {
    key: "oom",
    name: "Nine gigabytes of nothing",
    meta: "virtual memory · allocators · cgroups",
    blurb:
      "A memory investigation where every number the candidate has been trained to trust turns out to mean something slightly different from what they think.",
    stages: [
      {
        t: "Three numbers that disagree",
        setup:
          "A service tracks its own allocations and reports 2GB live. ps reports RSS of 8GB and VSZ of 40GB. The box has 32GB of RAM and is not swapping.",
        ask: "Define each of those three numbers precisely, and account for the gaps between them.",
        hint: "Ask what a page has to do to be counted in each one.",
        tags: ["RSS", "VSZ", "PSS", "COW", "page cache"],
        weak: "Treats RSS as 'memory the program is using' and VSZ as a bug.",
        solid:
          "VSZ is reserved address space, most of which is never backed: thread stacks (8MB of VA each by default), glibc arenas reserving 64MB apiece, mmap'd files, guard pages. RSS is resident physical pages, which includes shared library text, file-backed pages the process has touched, and pages shared copy-on-write with other processes — all counted in full. The allocator's own bookkeeping and fragmentation account for more.",
        strong:
          "Notes that RSS double-counts shared pages, so summing RSS across a process tree is meaningless, and reaches for PSS or USS via smaps_rollup instead. Knows which question each metric answers: 'how much would I get back if I killed this process' is USS, not RSS.",
      },
      {
        t: "Freed, but not returned",
        setup:
          "They fix the leak. Every allocation is now correctly freed — a heap profiler confirms zero live objects from the workload. RSS drops by 200MB out of 6GB and stays there. Calling malloc_trim recovers a bit more.",
        ask: "Why doesn't free() give memory back to the OS?",
        hint: "free() returns memory to the allocator. Returning it to the kernel is a separate, and much more constrained, decision.",
        tags: ["glibc malloc", "brk vs mmap", "fragmentation", "MADV_FREE"],
        weak: "'Memory leak somewhere else.' Doesn't distinguish allocator-free from kernel-free.",
        solid:
          "Explains that glibc grows the main heap with brk, which is a single contiguous region that can only be shrunk from the top. One live 64-byte object near the top pins everything beneath it. Allocations above MMAP_THRESHOLD get their own mapping and are genuinely unmapped on free. So the outcome depends entirely on allocation size distribution and fragmentation, and per-thread arenas multiply the effect.",
        strong:
          "Discusses arena count (MALLOC_ARENA_MAX defaults to 8× cores and each arena fragments independently), and contrasts with jemalloc/tcmalloc, which purge on a decay timer. Crucially notes that MADV_FREE-based purging means the kernel only reclaims the pages under pressure — so RSS staying high may be correct behavior and not a problem at all. Concludes that RSS is the wrong signal here; what matters is whether the process can be reclaimed under pressure.",
      },
      {
        t: "Copy-on-write that copies everything",
        setup:
          "A pre-fork server loads a 10GB read-mostly index in the parent, then forks 16 workers. The workers only ever read the index. The expectation is that all 16 share those pages. In production, memory climbs toward 10GB per worker and the box dies.",
        ask: "How can read-only access break copy-on-write?",
        hint: "The workers don't write to the index. Does anything else write to the same pages?",
        tags: ["fork", "COW", "refcounting", "GC", "THP"],
        weak: "Concludes fork doesn't actually share memory.",
        solid:
          "The data is read-only at the application level, but the runtime writes to memory that lives on the same physical pages: reference counts in object headers (CPython), GC mark bits, or a compacting collector relocating objects. Any write faults and copies the whole page, so touching one refcount copies 4KB. Sweeping the entire heap copies the entire heap.",
        strong:
          "Multiplies it by transparent huge pages: with 2MB pages, one refcount write copies 2MB, a 512× amplification — the exact reason Redis warns against THP when forking for persistence. Names real mitigations: gc.freeze() to move objects out of the GC's scan set before forking, restructuring so hot metadata isn't co-located with cold data, or dropping fork-sharing for an explicit shared mapping / memfd. Measures with Private_Dirty in smaps rather than arguing about it.",
      },
      {
        t: "The OOM killer picks wrong",
        setup:
          "Two facts to reconcile. Earlier in the incident, a malloc of 100GB on this 32GB box returned a valid pointer. Later, when the kernel ran out of memory, it killed the parent process and an unrelated database — but not the worker that was actually growing.",
        ask: "Explain both.",
        hint: "The kernel isn't tracking who allocated. It's tracking who is resident right now.",
        tags: ["overcommit", "demand paging", "oom_score", "PSI"],
        weak: "Thinks malloc reserves physical memory.",
        solid:
          "Overcommit: malloc gets address space, and physical pages are only allocated on first touch, so an enormous allocation succeeds until you actually use it. The OOM killer then scores processes roughly by current RSS plus oom_score_adj — the parent holding the big shared mapping scores high, and so does a database with a large resident working set, while the worker that merely caused the pressure may be smaller at that instant.",
        strong:
          "Notes overcommit is tunable (vm.overcommit_memory=2 makes malloc fail honestly, at the cost of breaking every fork-heavy and sparse-mapping workload) and that shared pages inflate the scores of everyone sharing them. Argues the real fix is not to reach the OOM killer at all: PSI-driven userspace killers like systemd-oomd act earlier with better context, and oom_score_adj should encode which processes are actually expendable.",
      },
      {
        t: "Killed with 100GB free",
        setup:
          "The service moves to Kubernetes with a 4GiB memory limit. It gets OOM-killed while the host has 100GB free. The kill reliably happens during a nightly job that reads a 20GB file sequentially. Swap is disabled, as it usually is on these nodes.",

Object.assign(A, A2);

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var pi = 0;
var open_ = P.map(function(){return 1;});
var panels = {};                       // "pi:i:h" -> true
var expanded = false;
var TOTAL = P.reduce(function(a,p){return a+p.stages.length;},0);

function pk(p,i,t){return p+':'+i+':'+t;}

function panelHTML(p,i,t,label,inner){
  return '<div class="panelbox '+(t==='a'?'ansbox ':'')+'hid" data-panel="'+pk(p,i,t)+'">'
       + '<div class="ph">'+label+'</div>'+inner+'</div>';
}

function answerHTML(a,p,i){
  if(!a) return '';
  var h = '<div class="crux">'+esc(a.crux)+'</div><div class="ansbody">';
  h += (a.body||[]).map(function(t){return '<p>'+esc(t)+'</p>';}).join('');
  if(a.code) h += '<pre class="code">'+esc(a.code)+'</pre>';
  h += (a.tail||[]).map(function(t){return '<p>'+esc(t)+'</p>';}).join('');
  return h+'</div>';
}

function build(){
  document.getElementById('rail').innerHTML =
    '<h2>Select problem</h2>' + P.map(function(p,i){
      return '<button class="item" data-go="'+i+'">'
        + '<span class="idx" data-t="'+esc(p.name)+'">0'+(i+1)+'</span>'
        + '<span class="nm">'+esc(p.name)+'</span>'
        + '<span class="mt" data-cnt="'+i+'"></span></button>';
    }).join('');

  document.getElementById('main').innerHTML = P.map(function(p,i){
    var meter = p.stages.map(function(){return '<span class="tick"></span>';}).join('');
    var stages = p.stages.map(function(s,j){
      var a = A[p.key+'.'+j];
      var last = j === p.stages.length-1;
      return '<section class="stage" data-st="'+i+':'+j+'">'
        + '<span class="sn"></span>'
        + '<div class="slab" data-slab="'+i+':'+j+'">Stage '+(i+1)+'.'+(j+1)+'</div>'
        + '<h2 class="st">'+esc(s.t)+'</h2>'
        + '<p class="setup">'+esc(s.setup)+'</p>'
        + '<p class="ask">'+esc(s.ask)+'</p>'
        + '<div class="tags">'+s.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>'
        + '<div class="acts">'
          + '<button class="btn" data-tog="'+pk(i,j,'h')+'"><span class="k">[H]</span> Nudge</button>'
          + '<button class="btn" data-tog="'+pk(i,j,'r')+'"><span class="k">[R]</span> What to listen for</button>'
          + '<button class="btn" data-tog="'+pk(i,j,'a')+'"><span class="k">[A]</span> Model answer</button>'
          + (last ? '' : '<button class="btn go hid" data-next="'+i+':'+j+'"><span class="k">[&#8629;]</span> Reveal next twist</button>')
        + '</div>'
        + panelHTML(i,j,'h','Nudge &mdash; only if they stall for a minute','<div class="pb">'+esc(s.hint)+'</div>')
        + panelHTML(i,j,'r','Grading signal',
            '<dl class="grade"><dt class="g1">Weak</dt><dd>'+esc(s.weak)+'</dd>'
          + '<dt class="g2">Solid</dt><dd>'+esc(s.solid)+'</dd>'
          + '<dt class="g3">Exceptional</dt><dd>'+esc(s.strong)+'</dd></dl>')
        + panelHTML(i,j,'a','Model answer &mdash; stage '+(i+1)+'.'+(j+1), answerHTML(a,i,j))
        + '</section>';
    }).join('');

    return '<article class="prob" data-prob="'+i+'">'
      + '<div class="eyebrow">Problem 0'+(i+1)+' &mdash; '+esc(p.meta)+'</div>'
      + '<h1 class="h1">'+esc(p.name)+'</h1>'
      + '<p class="blurb">'+esc(p.blurb)+'</p>'
      + '<div class="meter" data-meter="'+i+'">'+meter+'</div>'
      + stages
      + '<p class="foot hid" data-foot="'+i+'">End of problem 0'+(i+1)+'. A candidate who reached the last '
      + 'stage under their own steam is already above the internship bar &mdash; the final stages are there '
      + 'to find the ceiling, not the floor.</p></article>';
  }).join('');
}

function sync(){
  document.querySelectorAll('[data-prob]').forEach(function(el){
    el.classList.toggle('on', +el.dataset.prob === pi);
  });
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.classList.toggle('on', +el.dataset.go === pi);
  });
  P.forEach(function(p,i){
    var n = expanded ? p.stages.length : open_[i];
    document.querySelector('[data-cnt="'+i+'"]').textContent =
      n + '/' + p.stages.length + ' \u00b7 ' + p.meta.split(' \u00b7 ')[0];
    document.querySelectorAll('[data-meter="'+i+'"] .tick').forEach(function(t,j){
      t.className = 'tick' + (j < n-1 ? ' done' : j === n-1 ? ' now' : '');
    });
    document.querySelector('[data-foot="'+i+'"]').classList.toggle('hid', n < p.stages.length);
    p.stages.forEach(function(s,j){
      var live = j === n-1;
      var st = document.querySelector('[data-st="'+i+':'+j+'"]');
      st.classList.toggle('hid', j >= n);
      st.classList.toggle('live', live);
      document.querySelector('[data-slab="'+i+':'+j+'"]').textContent =
        'Stage '+(i+1)+'.'+(j+1) + (live && j>0 ? ' \u2014 new twist' : '');
      var nx = document.querySelector('[data-next="'+i+':'+j+'"]');
      if(nx) nx.classList.toggle('hid', !live);
      ['h','r','a'].forEach(function(t){
        var key = pk(i,j,t), on = !!panels[key] || expanded;
        document.querySelector('[data-panel="'+key+'"]').classList.toggle('hid', !on);
        document.querySelector('[data-tog="'+key+'"]').classList.toggle('on', on);
      });
    });
  });
  var seen = expanded ? TOTAL : open_.reduce(function(a,v){return a+v;},0);
  document.getElementById('count').textContent = seen + '/' + TOTAL + ' revealed';
  document.getElementById('exp').classList.toggle('on', expanded);
  document.getElementById('exp').textContent = expanded ? 'Collapse all' : 'Expand all';
}

function advance(){
  if(open_[pi] < P[pi].stages.length){ open_[pi]++; sync(); }
}
function toggle(key){
  if(expanded) return;
  panels[key] = !panels[key];
  sync();
}

build();
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-tog],[data-next],#exp,#print');
  if(!t) return;
  if(t.dataset.go !== undefined){ pi = +t.dataset.go; sync(); window.scrollTo(0,0); }
  else if(t.dataset.tog){ toggle(t.dataset.tog); }
  else if(t.dataset.next !== undefined){ advance(); }
  else if(t.id === 'exp'){ expanded = !expanded; sync(); }
  else if(t.id === 'print'){ window.print(); }
});
document.addEventListener('keydown', function(e){
  if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var n = parseInt(e.key,10);
  var cur = (expanded ? P[pi].stages.length : open_[pi]) - 1;
  if(n>=1 && n<=P.length){ pi = n-1; sync(); window.scrollTo(0,0); return; }
  if(e.key==='h'||e.key==='H') toggle(pk(pi,cur,'h'));
  if(e.key==='r'||e.key==='R') toggle(pk(pi,cur,'r'));
  if(e.key==='a'||e.key==='A') toggle(pk(pi,cur,'a'));
  if(e.key==='Enter'){ e.preventDefault(); advance(); }
  if(e.key==='ArrowDown'){ e.preventDefault(); pi = Math.min(pi+1, P.length-1); sync(); window.scrollTo(0,0); }
  if(e.key==='ArrowUp'){ e.preventDefault(); pi = Math.max(pi-1, 0); sync(); window.scrollTo(0,0); }
});
sync();

</script>
</body>
</html>
